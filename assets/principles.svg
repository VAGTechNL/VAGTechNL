<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL engineering principles</title><desc id="desc">Four premium technical principles: evidence, reversibility, traceability and no guesswork.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080B"/><stop offset=".72" stop-color="#090B0F"/><stop offset="1" stop-color="#11151B"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171C23"/><stop offset="1" stop-color="#0D0F13"/></linearGradient>
  <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
</defs>
<rect width="1200" height="320" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<g class="sans">
  <g transform="translate(42 38)"><path d="M0 0H24" stroke="#E30613" stroke-width="2.5"/><text x="36" y="4" class="mono" fill="#A7ADB7" font-size="11" font-weight="720" letter-spacing="1.75">ENGINEERING PRINCIPLES</text><text x="0" y="48" fill="#FFFFFF" font-size="29" font-weight="840">Precision is a product feature.</text><text x="0" y="77" fill="#6F7682" font-size="14">Every technical surface follows the same rules, from discussion to tooling.</text></g>

  <g transform="translate(42 150)">
    <path d="M0 0H1116" stroke="#1C2026"/><path d="M0 0H272" stroke="#E30613" stroke-width="2"/>
    <g>
      <rect width="258" height="124" rx="12" fill="url(#card)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#E30613" font-size="10" font-weight="800">01 / EVIDENCE</text><text x="18" y="57" fill="#FFFFFF" font-size="19" font-weight="840">Proof before claim.</text><text x="18" y="84" fill="#A7ADB7" font-size="12.5">Source and context stay attached.</text><text x="18" y="104" fill="#6F7682" font-size="11">Confidence never replaces evidence.</text>
    </g>
    <g transform="translate(286)"><rect width="258" height="124" rx="12" fill="url(#card)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#E30613" font-size="10" font-weight="800" opacity=".82">02 / REVERSIBLE</text><text x="18" y="57" fill="#FFFFFF" font-size="19" font-weight="840">Backup before change.</text><text x="18" y="84" fill="#A7ADB7" font-size="12.5">Current state is preserved first.</text><text x="18" y="104" fill="#6F7682" font-size="11">Rollback stays part of the method.</text></g>
    <g transform="translate(572)"><rect width="258" height="124" rx="12" fill="url(#card)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#E30613" font-size="10" font-weight="800" opacity=".64">03 / TRACEABLE</text><text x="18" y="57" fill="#FFFFFF" font-size="19" font-weight="840">Context survives.</text><text x="18" y="84" fill="#A7ADB7" font-size="12.5">Decisions retain revision and scope.</text><text x="18" y="104" fill="#6F7682" font-size="11">Reusable knowledge keeps its trail.</text></g>
    <g transform="translate(858)"><rect width="258" height="124" rx="12" fill="url(#card)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#E30613" font-size="10" font-weight="800" opacity=".5">04 / NO GUESSWORK</text><text x="18" y="57" fill="#FFFFFF" font-size="19" font-weight="840">Unknown is valid.</text><text x="18" y="84" fill="#A7ADB7" font-size="12.5">Uncertainty stays explicit.</text><text x="18" y="104" fill="#6F7682" font-size="11">No assumed compatibility.</text></g>
  </g>
</g>
</svg>