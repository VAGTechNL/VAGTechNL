<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL engineering principles</title>
<desc id="desc">Four engineering principles: evidence, reversibility, traceability and no assumed compatibility.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080B"/><stop offset="1" stop-color="#0D0F13"/></linearGradient>
</defs>
<rect width="1200" height="300" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#1C2026" stroke-width="2"/>
<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <text x="48" y="55" fill="#6F7682" font-size="13" font-weight="700" letter-spacing="2.2">ENGINEERING PRINCIPLES</text>
  <text x="48" y="90" fill="#FFFFFF" font-size="27" font-weight="800">A technical answer should survive a second look.</text>

  <g transform="translate(48 128)">
    <g>
      <rect width="256" height="126" rx="18" fill="#14171C" stroke="#1C2026"/>
      <text x="20" y="34" fill="#E10600" font-size="12" font-weight="800" letter-spacing="1.5">01</text>
      <text x="20" y="65" fill="#E6E8EB" font-size="20" font-weight="800">EVIDENCE</text>
      <text x="20" y="94" fill="#A7ADB7" font-size="14">Claim follows source and proof.</text>
    </g>
    <g transform="translate(282)">
      <rect width="256" height="126" rx="18" fill="#14171C" stroke="#1C2026"/>
      <text x="20" y="34" fill="#E10600" font-size="12" font-weight="800" letter-spacing="1.5" opacity="0.85">02</text>
      <text x="20" y="65" fill="#E6E8EB" font-size="20" font-weight="800">REVERSIBLE</text>
      <text x="20" y="94" fill="#A7ADB7" font-size="14">Backup first. Change second.</text>
    </g>
    <g transform="translate(564)">
      <rect width="256" height="126" rx="18" fill="#14171C" stroke="#1C2026"/>
      <text x="20" y="34" fill="#E10600" font-size="12" font-weight="800" letter-spacing="1.5" opacity="0.7">03</text>
      <text x="20" y="65" fill="#E6E8EB" font-size="20" font-weight="800">TRACEABLE</text>
      <text x="20" y="94" fill="#A7ADB7" font-size="14">Decisions retain their context.</text>
    </g>
    <g transform="translate(846)">
      <rect width="256" height="126" rx="18" fill="#14171C" stroke="#1C2026"/>
      <text x="20" y="34" fill="#E10600" font-size="12" font-weight="800" letter-spacing="1.5" opacity="0.55">04</text>
      <text x="20" y="65" fill="#E6E8EB" font-size="20" font-weight="800">NO GUESSWORK</text>
      <text x="20" y="94" fill="#A7ADB7" font-size="14">Unknown is a valid technical state.</text>
    </g>
  </g>
</g>
</svg>