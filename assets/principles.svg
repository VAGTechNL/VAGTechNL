<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL engineering principles</title><desc id="desc">Four compact engineering principles: evidence, reversibility, traceability and no guesswork.</desc>
<rect width="1200" height="250" rx="22" fill="#06080B"/><rect x="1" y="1" width="1198" height="248" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><g transform="translate(42 36)"><path d="M0 0H22" stroke="#E30613" stroke-width="2"/><text x="34" y="4" fill="#A7ADB7" font-size="11" font-weight="750" letter-spacing="1.8">ENGINEERING PRINCIPLES</text><text x="0" y="46" fill="#FFFFFF" font-size="26" font-weight="820">A technical answer should survive a second look.</text></g>
<g transform="translate(42 122)"><path d="M279 0V88M558 0V88M837 0V88" stroke="#1C2026"/><g><text x="0" y="18" fill="#E30613" font-size="10.5" font-weight="800">01</text><text x="0" y="46" fill="#FFFFFF" font-size="18" font-weight="820">EVIDENCE</text><text x="0" y="70" fill="#A7ADB7" font-size="13">Claims follow source and proof.</text></g><g transform="translate(300)"><text x="0" y="18" fill="#E30613" font-size="10.5" font-weight="800" opacity=".82">02</text><text x="0" y="46" fill="#FFFFFF" font-size="18" font-weight="820">REVERSIBLE</text><text x="0" y="70" fill="#A7ADB7" font-size="13">Backup first. Change second.</text></g><g transform="translate(579)"><text x="0" y="18" fill="#E30613" font-size="10.5" font-weight="800" opacity=".66">03</text><text x="0" y="46" fill="#FFFFFF" font-size="18" font-weight="820">TRACEABLE</text><text x="0" y="70" fill="#A7ADB7" font-size="13">Decisions retain their context.</text></g><g transform="translate(858)"><text x="0" y="18" fill="#E30613" font-size="10.5" font-weight="800" opacity=".5">04</text><text x="0" y="46" fill="#FFFFFF" font-size="18" font-weight="820">NO GUESSWORK</text><text x="0" y="70" fill="#A7ADB7" font-size="13">Unknown is a valid technical state.</text></g></g></g></svg>