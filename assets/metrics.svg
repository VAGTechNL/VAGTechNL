<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">VAGTechNL GitHub telemetry</title>
  <desc id="desc">Daily refreshed public GitHub profile metrics.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0F13"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#07080B"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#1C2026" stroke-width="2"/>

  <g transform="translate(38 32)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#6F7682" font-size="12" letter-spacing="1.8">LIVE GITHUB SIGNAL</text>
    <text x="0" y="31" fill="#FFFFFF" font-size="24" font-weight="700">Public profile telemetry</text>
    <text x="0" y="55" fill="#A7ADB7" font-size="14">Refreshed daily by GitHub Actions · public data only.</text>

    <g transform="translate(0 82)">

      <g transform="translate(0 0)">
        <rect width="266" height="102" rx="14" fill="url(#panel)" stroke="#1C2026"/>
        <rect width="5" height="102" rx="2.5" fill="#E10600"/>
        <text x="22" y="29" fill="#6F7682" font-size="11" letter-spacing="1.2">PUBLIC REPOS</text>
        <text x="22" y="72" fill="#FFFFFF" font-size="34" font-weight="700">1</text>
      </g>

      <g transform="translate(286 0)">
        <rect width="266" height="102" rx="14" fill="url(#panel)" stroke="#1C2026"/>
        <rect width="5" height="102" rx="2.5" fill="#E10600"/>
        <text x="22" y="29" fill="#6F7682" font-size="11" letter-spacing="1.2">FOLLOWERS</text>
        <text x="22" y="72" fill="#FFFFFF" font-size="34" font-weight="700">4</text>
      </g>

      <g transform="translate(572 0)">
        <rect width="266" height="102" rx="14" fill="url(#panel)" stroke="#1C2026"/>
        <rect width="5" height="102" rx="2.5" fill="#E10600"/>
        <text x="22" y="29" fill="#6F7682" font-size="11" letter-spacing="1.2">TOTAL STARS</text>
        <text x="22" y="72" fill="#FFFFFF" font-size="34" font-weight="700">5</text>
      </g>

      <g transform="translate(858 0)">
        <rect width="266" height="102" rx="14" fill="url(#panel)" stroke="#1C2026"/>
        <rect width="5" height="102" rx="2.5" fill="#E10600"/>
        <text x="22" y="29" fill="#6F7682" font-size="11" letter-spacing="1.2">PUBLIC EVENTS · 30D</text>
        <text x="22" y="72" fill="#FFFFFF" font-size="34" font-weight="700">37</text>
      </g>
    </g>

    <g transform="translate(0 214)">
      <text x="0" y="0" fill="#6F7682" font-size="11" letter-spacing="1.2">PUBLIC CODE MIX</text>
      <rect x="0" y="18" width="1124" height="12" rx="6" fill="#1C2026"/>
      <text x="0" y="58" fill="#A7ADB7" font-size="14">No public code repositories indexed yet. Profile repository is excluded.</text>
      <path d="M0 78H1124" stroke="#1C2026"/>
      <text x="0" y="105" fill="#6F7682" font-size="11">SOURCE · GitHub public API</text>
      <text x="1124" y="105" fill="#6F7682" font-size="11" text-anchor="end">UPDATED · 2026-09-06 21:02 UTC</text>
    </g>
  </g>
</svg>