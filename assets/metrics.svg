<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">VAGTechNL GitHub telemetry</title>
  <desc id="desc">Daily refreshed public GitHub profile metrics.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080B"/>
      <stop offset="1" stop-color="#0D0F13"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0F13"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @media (prefers-reduced-motion: reduce){.signal-motion{display:none}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#1C2026" stroke-width="2"/>
  <path d="M38 1H150" stroke="#E10600" stroke-width="2" stroke-linecap="round" opacity=".72"/>

  <g transform="translate(38 30)" class="sans">
    
      <g transform="translate(4 4)" class="signal-motion">
        <circle cx="0" cy="0" r="4" fill="#FF2A23" opacity=".90"/>
        <circle cx="0" cy="0" r="4" fill="none" stroke="#FF2A23" stroke-width="1.2" opacity="0">
          <animate attributeName="r" dur="5.5s" repeatCount="indefinite" values="4;4;11;14" keyTimes="0;.15;.32;1"/>
          <animate attributeName="opacity" dur="5.5s" repeatCount="indefinite" values="0;.28;.12;0" keyTimes="0;.15;.32;1"/>
        </circle>
      </g>
    <text x="18" y="8" class="mono" fill="#6F7682" font-size="11" letter-spacing="1.65">PUBLIC GITHUB SIGNAL</text>
    <text x="0" y="43" fill="#FFFFFF" font-size="23" font-weight="760">Profile telemetry</text>
    <text x="0" y="67" fill="#A7ADB7" font-size="13.5">Daily public snapshot · generated by GitHub Actions</text>

    <g transform="translate(0 91)">
      
      <g transform="translate(0 0)">
        <rect width="266" height="96" rx="14" fill="url(#card)" stroke="#1C2026"/>
        <path d="M18 1H54" stroke="#E10600" stroke-width="2" stroke-linecap="round" opacity=".90"/>
        <circle cx="22" cy="28" r="3" fill="#FF2A23" opacity=".75"/>
        <text x="34" y="32" class="mono" fill="#6F7682" font-size="10.5" letter-spacing="1.15">PUBLIC REPOS</text>
        <text x="20" y="72" fill="#FFFFFF" font-size="31" font-weight="760">1</text>
      </g>
      
      <g transform="translate(286 0)">
        <rect width="266" height="96" rx="14" fill="url(#card)" stroke="#1C2026"/>
        <path d="M18 1H54" stroke="#E10600" stroke-width="2" stroke-linecap="round" opacity=".90"/>
        <circle cx="22" cy="28" r="3" fill="#FF2A23" opacity=".75"/>
        <text x="34" y="32" class="mono" fill="#6F7682" font-size="10.5" letter-spacing="1.15">FOLLOWERS</text>
        <text x="20" y="72" fill="#FFFFFF" font-size="31" font-weight="760">4</text>
      </g>
      
      <g transform="translate(572 0)">
        <rect width="266" height="96" rx="14" fill="url(#card)" stroke="#1C2026"/>
        <path d="M18 1H54" stroke="#E10600" stroke-width="2" stroke-linecap="round" opacity=".90"/>
        <circle cx="22" cy="28" r="3" fill="#FF2A23" opacity=".75"/>
        <text x="34" y="32" class="mono" fill="#6F7682" font-size="10.5" letter-spacing="1.15">TOTAL STARS</text>
        <text x="20" y="72" fill="#FFFFFF" font-size="31" font-weight="760">5</text>
      </g>
      
      <g transform="translate(858 0)">
        <rect width="266" height="96" rx="14" fill="url(#card)" stroke="#1C2026"/>
        <path d="M18 1H54" stroke="#E10600" stroke-width="2" stroke-linecap="round" opacity=".90"/>
        <circle cx="22" cy="28" r="3" fill="#FF2A23" opacity=".75"/>
        <text x="34" y="32" class="mono" fill="#6F7682" font-size="10.5" letter-spacing="1.15">PUBLIC EVENTS · 30D</text>
        <text x="20" y="72" fill="#FFFFFF" font-size="31" font-weight="760">37</text>
      </g>
    </g>

    <g transform="translate(0 217)">
      <text x="0" y="0" class="mono" fill="#6F7682" font-size="10.5" letter-spacing="1.15">PUBLIC CODE MIX</text>
      <text x="1124" y="0" class="mono" fill="#6F7682" font-size="10" text-anchor="end">PROFILE REPO EXCLUDED</text>
      <rect x="0" y="22" width="1124" height="8" rx="4" fill="#1C2026"/>
      <rect x="0" y="22" width="72" height="8" rx="4" fill="#252A32" opacity=".7" class="signal-motion">
        <animate attributeName="x" dur="7s" repeatCount="indefinite" values="0;1052;0" keyTimes="0;.5;1"/>
        <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values=".18;.48;.18" keyTimes="0;.5;1"/>
      </rect>
      
      <text x="0" y="60" fill="#E6E8EB" font-size="13.5">No public code repositories yet.</text>
      <text x="0" y="82" class="mono" fill="#6F7682" font-size="10.5">PROFILE REPOSITORY EXCLUDED · MIX STARTS AUTOMATICALLY WITH THE NEXT PUBLIC CODE REPO</text>

      <path d="M0 96H1124" stroke="#1C2026"/>
      <text x="0" y="121" class="mono" fill="#6F7682" font-size="10">GITHUB PUBLIC API · DAILY 04:23 UTC</text>
      <text x="1124" y="121" class="mono" fill="#6F7682" font-size="10" text-anchor="end">UPDATED · 2026-09-06 21:09 UTC</text>
    </g>
  </g>
</svg>