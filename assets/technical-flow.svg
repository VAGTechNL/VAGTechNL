<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL technical flow</title>
<desc id="desc">Technical flow from vehicle data through gateway and protocols into evidence, knowledge and tooling, with a slow sequential pulse.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080B"/><stop offset="1" stop-color="#0D0F13"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#A7ADB7" stroke-opacity="0.045"/></pattern>
</defs>
<style>
  @media (prefers-reduced-motion: reduce) { .flow-motion { display: none; } }
</style>
<rect width="1200" height="390" rx="28" fill="url(#bg)"/>
<rect width="1200" height="390" rx="28" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="#1C2026" stroke-width="2"/>
<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <text x="48" y="58" fill="#6F7682" font-size="13" font-weight="700" letter-spacing="2.2">TECHNICAL FLOW</text>
  <text x="48" y="94" fill="#FFFFFF" font-size="28" font-weight="800">From vehicle signal to defensible knowledge</text>
  <text x="48" y="122" fill="#6F7682" font-size="15">Read the data, preserve the context, verify the evidence and keep changes reversible.</text>

  <g transform="translate(54 177)">
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 55H202" stroke="#252A32" stroke-width="4"/>
      <path d="M322 55H374" stroke="#252A32" stroke-width="4"/>
      <path d="M514 55H566" stroke="#252A32" stroke-width="4"/>
      <path d="M736 55H788" stroke="#252A32" stroke-width="4"/>
      <circle cx="176" cy="55" r="5" fill="#E10600"/>
      <circle cx="348" cy="55" r="5" fill="#E10600" opacity="0.85"/>
      <circle cx="540" cy="55" r="5" fill="#E10600" opacity="0.70"/>
      <circle cx="762" cy="55" r="5" fill="#E10600" opacity="0.55"/>
    </g>

    <g>
      <rect x="0" y="0" width="150" height="110" rx="17" fill="#14171C" stroke="#1C2026"/>
      <text x="18" y="29" fill="#6F7682" font-size="11" font-weight="700" letter-spacing="1.4">INPUT</text>
      <text x="18" y="58" fill="#E6E8EB" font-size="20" font-weight="800">VEHICLE</text>
      <text x="18" y="84" fill="#A7ADB7" font-size="12">scan · module · dataset</text>

      <rect x="202" y="0" width="120" height="110" rx="17" fill="#14171C" stroke="#E10600" stroke-opacity="0.5"/>
      <text x="220" y="29" fill="#6F7682" font-size="11" font-weight="700" letter-spacing="1.4">ROUTE</text>
      <text x="220" y="58" fill="#E6E8EB" font-size="20" font-weight="800">GW</text>
      <text x="220" y="84" fill="#FF2A23" font-size="13">CAN</text>

      <rect x="374" y="0" width="140" height="110" rx="17" fill="#14171C" stroke="#1C2026"/>
      <text x="392" y="29" fill="#6F7682" font-size="11" font-weight="700" letter-spacing="1.4">METHOD</text>
      <text x="392" y="58" fill="#E6E8EB" font-size="20" font-weight="800">UDS</text>
      <text x="392" y="84" fill="#A7ADB7" font-size="12">ODX · coding</text>

      <rect x="566" y="0" width="170" height="110" rx="17" fill="#14171C" stroke="#1C2026"/>
      <text x="584" y="29" fill="#6F7682" font-size="11" font-weight="700" letter-spacing="1.4">PROOF</text>
      <text x="584" y="58" fill="#E6E8EB" font-size="20" font-weight="800">EVIDENCE</text>
      <text x="584" y="84" fill="#A7ADB7" font-size="12">source · context</text>

      <rect x="788" y="0" width="304" height="110" rx="17" fill="#14171C" stroke="#1C2026"/>
      <text x="806" y="29" fill="#6F7682" font-size="11" font-weight="700" letter-spacing="1.4">OUTPUT</text>
      <text x="806" y="58" fill="#E6E8EB" font-size="20" font-weight="800">KNOWLEDGE + TOOLING</text>
      <text x="806" y="84" fill="#A7ADB7" font-size="12">traceable · reusable · testable</text>
    </g>

    <g class="flow-motion" fill="none" stroke="#FF2A23" stroke-width="2.4" pointer-events="none">
      <rect x="0" y="0" width="150" height="110" rx="17" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;.78;.16;.78;.16;.78;0;0" keyTimes="0;.02;.055;.09;.125;.16;.19;1"/></rect>
      <rect x="202" y="0" width="120" height="110" rx="17" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;.78;.16;.78;.16;.78;0;0" keyTimes="0;.2;.22;.255;.29;.325;.36;.39;1"/></rect>
      <rect x="374" y="0" width="140" height="110" rx="17" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;.78;.16;.78;.16;.78;0;0" keyTimes="0;.4;.42;.455;.49;.525;.56;.59;1"/></rect>
      <rect x="566" y="0" width="170" height="110" rx="17" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;.78;.16;.78;.16;.78;0;0" keyTimes="0;.6;.62;.655;.69;.725;.76;.79;1"/></rect>
      <rect x="788" y="0" width="304" height="110" rx="17" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;.78;.16;.78;.16;.78;0;0" keyTimes="0;.8;.82;.855;.89;.925;.96;.99;1"/></rect>
    </g>

    <g class="flow-motion" fill="#FF2A23" pointer-events="none">
      <circle r="5" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.155;.16;.195;.2;1"/><animateMotion dur="20s" repeatCount="indefinite" path="M150 55 L202 55" keyPoints="0;0;1;1" keyTimes="0;.155;.195;1" calcMode="linear"/></circle>
      <circle r="5" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.355;.36;.395;.4;1"/><animateMotion dur="20s" repeatCount="indefinite" path="M322 55 L374 55" keyPoints="0;0;1;1" keyTimes="0;.355;.395;1" calcMode="linear"/></circle>
      <circle r="5" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.555;.56;.595;.6;1"/><animateMotion dur="20s" repeatCount="indefinite" path="M514 55 L566 55" keyPoints="0;0;1;1" keyTimes="0;.555;.595;1" calcMode="linear"/></circle>
      <circle r="5" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.755;.76;.795;.8;1"/><animateMotion dur="20s" repeatCount="indefinite" path="M736 55 L788 55" keyPoints="0;0;1;1" keyTimes="0;.755;.795;1" calcMode="linear"/></circle>
    </g>

    <g transform="translate(0 148)">
      <path d="M0 0H1092" stroke="#1C2026"/>
      <text x="0" y="32" fill="#E10600" font-size="12" font-weight="800" letter-spacing="1.7">RULE</text>
      <text x="58" y="32" fill="#E6E8EB" font-size="15">Unknown stays unknown.</text>
      <text x="247" y="32" fill="#6F7682" font-size="15">No compatibility claim without evidence.</text>
      <text x="565" y="32" fill="#6F7682" font-size="15">Changes stay reversible where possible.</text>
    </g>
  </g>
</g>
</svg>