<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL evidence-first technical method</title><desc id="desc">A premium technical flow where context is identified, evidence is verified and only then preserved and reused.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080B"/><stop offset=".72" stop-color="#090B0F"/><stop offset="1" stop-color="#11151B"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151A21"/><stop offset="1" stop-color="#0D0F13"/></linearGradient>
  <radialGradient id="verifyGlow" cx="50%" cy="50%" r="65%"><stop offset="0" stop-color="#E30613" stop-opacity=".18"/><stop offset=".55" stop-color="#E30613" stop-opacity=".05"/><stop offset="1" stop-color="#E30613" stop-opacity="0"/></radialGradient>
  <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
</defs>
<rect width="1200" height="390" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="388" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<circle cx="604" cy="236" r="150" fill="url(#verifyGlow)"/>
<g class="sans">
  <g transform="translate(42 38)"><path d="M0 0H24" stroke="#E30613" stroke-width="2.5"/><text x="36" y="4" class="mono" fill="#A7ADB7" font-size="11" font-weight="720" letter-spacing="1.75">TECHNICAL METHOD</text><text x="0" y="48" fill="#FFFFFF" font-size="29" font-weight="840">The decision point is evidence.</text><text x="0" y="77" fill="#6F7682" font-size="14">Observe first. Preserve context. Verify before anything becomes reusable knowledge.</text></g>

  <g transform="translate(42 150)">
    <path d="M178 62H220M398 62H440M664 62H706M884 62H926" stroke="#252A32" stroke-width="3" stroke-linecap="round"/>
    <g fill="#E30613"><circle cx="199" cy="62" r="4"/><circle cx="419" cy="62" r="4" opacity=".78"/><circle cx="685" cy="62" r="4" opacity=".6"/><circle cx="905" cy="62" r="4" opacity=".42"/></g>
    <g class="motion" fill="#FF6B73">
      <circle r="4.5" opacity="0"><animate attributeName="opacity" values="0;.9;.9;0;0" keyTimes="0;.05;.9;.96;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M178 62 L926 62" dur="12s" repeatCount="indefinite"/></circle>
    </g>

    <g><rect width="178" height="124" rx="12" fill="url(#panel)" stroke="#1C2026"/><text x="16" y="25" class="mono" fill="#6F7682" font-size="9.5">01 / CASE</text><text x="16" y="56" fill="#FFFFFF" font-size="20" font-weight="840">OBSERVE</text><text x="16" y="82" fill="#A7ADB7" font-size="12.5">Question · source</text><text x="16" y="103" fill="#6F7682" font-size="11">Capture what is actually known.</text></g>

    <g transform="translate(220)"><rect width="178" height="124" rx="12" fill="url(#panel)" stroke="#1C2026"/><text x="16" y="25" class="mono" fill="#6F7682" font-size="9.5">02 / CONTEXT</text><text x="16" y="56" fill="#FFFFFF" font-size="20" font-weight="840">IDENTIFY</text><text x="16" y="82" fill="#A7ADB7" font-size="12.5">Vehicle · module · revision</text><text x="16" y="103" fill="#6F7682" font-size="11">Context before comparison.</text></g>

    <g transform="translate(440 -10)"><rect width="224" height="144" rx="14" fill="#11151B" stroke="#E30613" stroke-opacity=".72" stroke-width="1.5"/><rect width="4" height="144" rx="2" fill="#E30613"/><text x="20" y="29" class="mono" fill="#FF6B73" font-size="9.5">03 / EVIDENCE GATE</text><text x="20" y="65" fill="#FFFFFF" font-size="24" font-weight="860">VERIFY</text><text x="20" y="92" fill="#A7ADB7" font-size="12.5">BEVESTIGD · AANNEMELIJK · ONBEKEND</text><path d="M20 108H204" stroke="#252A32"/><text x="20" y="129" fill="#6F7682" font-size="11">No visual confidence becomes fact.</text><circle class="motion" cx="196" cy="27" r="4" fill="#FF6B73"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/></circle></g>

    <g transform="translate(706)"><rect width="178" height="124" rx="12" fill="url(#panel)" stroke="#1C2026"/><text x="16" y="25" class="mono" fill="#6F7682" font-size="9.5">04 / KNOWLEDGE</text><text x="16" y="56" fill="#FFFFFF" font-size="20" font-weight="840">PRESERVE</text><text x="16" y="82" fill="#A7ADB7" font-size="12.5">Source · decision · context</text><text x="16" y="103" fill="#6F7682" font-size="11">Keep the reasoning traceable.</text></g>

    <g transform="translate(926)"><rect width="190" height="124" rx="12" fill="url(#panel)" stroke="#1C2026"/><text x="16" y="25" class="mono" fill="#6F7682" font-size="9.5">05 / OUTPUT</text><text x="16" y="56" fill="#FFFFFF" font-size="20" font-weight="840">REUSE</text><text x="16" y="82" fill="#A7ADB7" font-size="12.5">Forum · knowledge · tooling</text><text x="16" y="103" fill="#6F7682" font-size="11">Only inside the proven scope.</text></g>
  </g>

  <g transform="translate(42 326)"><path d="M0 0H1116" stroke="#1C2026"/><text x="0" y="28" class="mono" fill="#E30613" font-size="10" font-weight="800">RULE</text><text x="55" y="28" fill="#E6E8EB" font-size="13">Unknown stays unknown.</text><text x="232" y="28" fill="#6F7682" font-size="13">No compatibility claim without evidence.</text><text x="522" y="28" fill="#6F7682" font-size="13">Changes stay reversible where possible.</text></g>
</g>
</svg>