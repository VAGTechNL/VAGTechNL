<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL evidence flow</title><desc id="desc">Technical method from case and context through evidence to reusable knowledge and controlled output.</desc><defs><style>@media (prefers-reduced-motion: reduce){.flow-motion{display:none}}</style></defs>
<rect width="1200" height="350" rx="22" fill="#06080B"/><rect x="1" y="1" width="1198" height="348" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<rect x="1082" y="26" width="3" height="300" rx="1.5" fill="#E30613" opacity=".08"/><rect x="1100" y="70" width="1.5" height="200" fill="#FF6B73" opacity=".16"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><g transform="translate(42 38)"><path d="M0 0H22" stroke="#E30613" stroke-width="2"/><text x="34" y="4" fill="#A7ADB7" font-size="11" font-weight="750" letter-spacing="1.8">TECHNICAL METHOD</text><text x="0" y="48" fill="#FFFFFF" font-size="28" font-weight="820">Context first. Evidence before conclusion.</text><text x="0" y="75" fill="#6F7682" font-size="14">A convincing interface never turns uncertainty into technical truth.</text></g>
<g transform="translate(42 142)"><path d="M204 54H228M428 54H452M652 54H676M876 54H900" stroke="#252A32" stroke-width="2"/><g fill="#E30613"><circle cx="216" cy="54" r="3.5"/><circle cx="440" cy="54" r="3.5" opacity=".78"/><circle cx="664" cy="54" r="3.5" opacity=".58"/><circle cx="888" cy="54" r="3.5" opacity=".42"/></g><circle class="flow-motion" r="4" fill="#FF6B73" opacity="0"><animate attributeName="opacity" values="0;.9;.9;0;0" keyTimes="0;.03;.87;.92;1" dur="10s" repeatCount="indefinite"/><animateMotion path="M204 54 L900 54" dur="10s" repeatCount="indefinite"/></circle>
<g><rect width="162" height="108" rx="11" fill="#0B0E12" stroke="#1C2026"/><text x="16" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">01 / CASE</text><text x="16" y="55" fill="#FFFFFF" font-size="18" font-weight="820">OBSERVE</text><text x="16" y="79" fill="#A7ADB7" font-size="11.5">question · source</text></g>
<g transform="translate(228)"><rect width="200" height="108" rx="11" fill="#0B0E12" stroke="#1C2026"/><text x="16" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">02 / CONTEXT</text><text x="16" y="55" fill="#FFFFFF" font-size="18" font-weight="820">IDENTIFY</text><text x="16" y="79" fill="#A7ADB7" font-size="11.5">vehicle · module · revision</text></g>
<g transform="translate(452)"><rect width="200" height="108" rx="11" fill="#0B0E12" stroke="#E30613" stroke-opacity=".42"/><text x="16" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">03 / EVIDENCE</text><text x="16" y="55" fill="#FFFFFF" font-size="18" font-weight="820">VERIFY</text><text x="16" y="79" fill="#A7ADB7" font-size="11.5">confirmed · likely · unknown</text></g>
<g transform="translate(676)"><rect width="200" height="108" rx="11" fill="#0B0E12" stroke="#1C2026"/><text x="16" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">04 / KNOWLEDGE</text><text x="16" y="55" fill="#FFFFFF" font-size="18" font-weight="820">PRESERVE</text><text x="16" y="79" fill="#A7ADB7" font-size="11.5">source · decision · context</text></g>
<g transform="translate(900)"><rect width="216" height="108" rx="11" fill="#0B0E12" stroke="#1C2026"/><text x="16" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">05 / OUTPUT</text><text x="16" y="55" fill="#FFFFFF" font-size="18" font-weight="820">REUSE</text><text x="16" y="79" fill="#A7ADB7" font-size="11.5">forum · knowledge · tooling</text></g></g>
<g transform="translate(42 286)"><path d="M0 0H1116" stroke="#1C2026"/><text x="0" y="28" fill="#E30613" font-size="11" font-weight="800" letter-spacing="1.5">RULE</text><text x="55" y="28" fill="#E6E8EB" font-size="13.5">Unknown stays unknown.</text><text x="236" y="28" fill="#6F7682" font-size="13.5">No compatibility claim without evidence.</text><text x="532" y="28" fill="#6F7682" font-size="13.5">Changes stay reversible where possible.</text></g></g></svg>