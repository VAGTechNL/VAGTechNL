<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL mobile engineering principles</title>
<desc id="desc">Four engineering principles in a two by two mobile grid.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080B"/><stop offset="1" stop-color="#0D0F13"/></linearGradient></defs>
<rect width="640" height="580" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="638" height="578" rx="27" fill="none" stroke="#1C2026" stroke-width="2"/>
<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <text x="36" y="48" fill="#6F7682" font-size="14" font-weight="700" letter-spacing="2.2">ENGINEERING PRINCIPLES</text>
  <text x="36" y="84" fill="#FFFFFF" font-size="27" font-weight="800">A technical answer should survive a second look.</text>
  <g transform="translate(36 124)">
    <g>
      <rect width="274" height="180" rx="18" fill="#14171C" stroke="#1C2026"/>
      <text x="20" y="36" fill="#E10600" font-size="13" font-weight="800">01</text>
      <text x="20" y="72" fill="#FFFFFF" font-size="22" font-weight="800">EVIDENCE</text>
      <text x="20" y="108" fill="#A7ADB7" font-size="15">Claim follows source</text>
      <text x="20" y="132" fill="#A7ADB7" font-size="15">and proof.</text>
    </g>
    <g transform="translate(294 0)">
      <rect width="274" height="180" rx="18" fill="#14171C" stroke="#1C2026"/>
      <text x="20" y="36" fill="#E10600" font-size="13" font-weight="800" opacity=".85">02</text>
      <text x="20" y="72" fill="#FFFFFF" font-size="22" font-weight="800">REVERSIBLE</text>
      <text x="20" y="108" fill="#A7ADB7" font-size="15">Backup first.</text>
      <text x="20" y="132" fill="#A7ADB7" font-size="15">Change second.</text>
    </g>
    <g transform="translate(0 200)">
      <rect width="274" height="180" rx="18" fill="#14171C" stroke="#1C2026"/>
      <text x="20" y="36" fill="#E10600" font-size="13" font-weight="800" opacity=".7">03</text>
      <text x="20" y="72" fill="#FFFFFF" font-size="22" font-weight="800">TRACEABLE</text>
      <text x="20" y="108" fill="#A7ADB7" font-size="15">Decisions retain</text>
      <text x="20" y="132" fill="#A7ADB7" font-size="15">their context.</text>
    </g>
    <g transform="translate(294 200)">
      <rect width="274" height="180" rx="18" fill="#14171C" stroke="#1C2026"/>
      <text x="20" y="36" fill="#E10600" font-size="13" font-weight="800" opacity=".55">04</text>
      <text x="20" y="72" fill="#FFFFFF" font-size="22" font-weight="800">NO GUESSWORK</text>
      <text x="20" y="108" fill="#A7ADB7" font-size="15">Unknown is a valid</text>
      <text x="20" y="132" fill="#A7ADB7" font-size="15">technical state.</text>
    </g>
  </g>
</g>
</svg>