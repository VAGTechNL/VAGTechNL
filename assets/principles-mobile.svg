<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL mobile engineering principles</title><desc id="desc">Four compact engineering principles in a mobile list.</desc>
<rect width="640" height="500" rx="22" fill="#06080B"/><rect x="1" y="1" width="638" height="498" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<rect x="548" y="26" width="3" height="520" rx="1.5" fill="#E30613" opacity=".08"/><rect x="566" y="70" width="1.5" height="420" fill="#FF6B73" opacity=".16"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><g transform="translate(34 36)"><path d="M0 0H22" stroke="#E30613" stroke-width="2"/><text x="34" y="4" fill="#A7ADB7" font-size="11" font-weight="750" letter-spacing="1.6">ENGINEERING PRINCIPLES</text><text x="0" y="46" fill="#FFFFFF" font-size="26" font-weight="820">Technical answers must survive a second look.</text></g>
<g transform="translate(34 124)"><rect width="572" height="320" rx="13" fill="#0B0E12" stroke="#1C2026"/><g transform="translate(18 18)"><g><text x="0" y="18" fill="#E30613" font-size="10.5" font-weight="800">01</text><text x="44" y="18" fill="#FFFFFF" font-size="16" font-weight="820">EVIDENCE</text><text x="214" y="18" fill="#A7ADB7" font-size="13">Claims follow source and proof.</text></g><path d="M0 54H536" stroke="#1C2026"/><g transform="translate(0 72)"><text x="0" y="18" fill="#E30613" font-size="10.5" font-weight="800" opacity=".82">02</text><text x="44" y="18" fill="#FFFFFF" font-size="16" font-weight="820">REVERSIBLE</text><text x="214" y="18" fill="#A7ADB7" font-size="13">Backup first. Change second.</text></g><path d="M0 126H536" stroke="#1C2026"/><g transform="translate(0 144)"><text x="0" y="18" fill="#E30613" font-size="10.5" font-weight="800" opacity=".66">03</text><text x="44" y="18" fill="#FFFFFF" font-size="16" font-weight="820">TRACEABLE</text><text x="214" y="18" fill="#A7ADB7" font-size="13">Decisions retain their context.</text></g><path d="M0 198H536" stroke="#1C2026"/><g transform="translate(0 216)"><text x="0" y="18" fill="#E30613" font-size="10.5" font-weight="800" opacity=".5">04</text><text x="44" y="18" fill="#FFFFFF" font-size="16" font-weight="820">NO GUESSWORK</text><text x="214" y="18" fill="#A7ADB7" font-size="13">Unknown is a valid technical state.</text></g></g></g></g></svg>