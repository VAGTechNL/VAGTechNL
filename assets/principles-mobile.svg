<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL mobile engineering principles</title><desc id="desc">Four premium technical principles in a compact mobile layout.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080B"/><stop offset="1" stop-color="#11151B"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171C23"/><stop offset="1" stop-color="#0D0F13"/></linearGradient><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style></defs>
<rect width="640" height="650" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="638" height="648" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<g class="sans"><g transform="translate(34 36)"><path d="M0 0H24" stroke="#E30613" stroke-width="2.5"/><text x="36" y="4" class="mono" fill="#A7ADB7" font-size="10.5" font-weight="720" letter-spacing="1.55">ENGINEERING PRINCIPLES</text><text x="0" y="48" fill="#FFFFFF" font-size="27" font-weight="840">Precision is a product feature.</text><text x="0" y="76" fill="#6F7682" font-size="14">One rule set across community, knowledge and tooling.</text></g>
<g transform="translate(34 136)">
  <g><rect width="572" height="106" rx="11" fill="url(#card)" stroke="#E30613" stroke-opacity=".42"/><rect width="4" height="106" rx="2" fill="#E30613"/><text x="18" y="25" class="mono" fill="#E30613" font-size="9.5" font-weight="800">01 / EVIDENCE</text><text x="18" y="55" fill="#FFFFFF" font-size="18" font-weight="840">Proof before claim.</text><text x="202" y="55" fill="#A7ADB7" font-size="12.5">Source and context stay attached.</text><text x="18" y="80" fill="#6F7682" font-size="11">Confidence never replaces evidence.</text></g>
  <g transform="translate(0 118)"><rect width="572" height="106" rx="11" fill="url(#card)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#E30613" font-size="9.5" font-weight="800" opacity=".82">02 / REVERSIBLE</text><text x="18" y="55" fill="#FFFFFF" font-size="18" font-weight="840">Backup before change.</text><text x="202" y="55" fill="#A7ADB7" font-size="12.5">Current state is preserved first.</text><text x="18" y="80" fill="#6F7682" font-size="11">Rollback stays part of the method.</text></g>
  <g transform="translate(0 236)"><rect width="572" height="106" rx="11" fill="url(#card)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#E30613" font-size="9.5" font-weight="800" opacity=".64">03 / TRACEABLE</text><text x="18" y="55" fill="#FFFFFF" font-size="18" font-weight="840">Context survives.</text><text x="202" y="55" fill="#A7ADB7" font-size="12.5">Decisions retain revision and scope.</text><text x="18" y="80" fill="#6F7682" font-size="11">Reusable knowledge keeps its trail.</text></g>
  <g transform="translate(0 354)"><rect width="572" height="106" rx="11" fill="url(#card)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#E30613" font-size="9.5" font-weight="800" opacity=".5">04 / NO GUESSWORK</text><text x="18" y="55" fill="#FFFFFF" font-size="18" font-weight="840">Unknown is valid.</text><text x="202" y="55" fill="#A7ADB7" font-size="12.5">Uncertainty stays explicit.</text><text x="18" y="80" fill="#6F7682" font-size="11">No assumed compatibility.</text></g>
</g></g>
</svg>