<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL mobile GitHub profile hero</title>
<desc id="desc">Mobile dark premium automotive hero with stylised vehicle, red garage light and evidence-first positioning.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080B"/><stop offset=".7" stop-color="#090B0F"/><stop offset="1" stop-color="#11151B"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E30613" stop-opacity="0"/><stop offset=".48" stop-color="#FF6B73" stop-opacity=".7"/><stop offset="1" stop-color="#E30613" stop-opacity="0"/></linearGradient>
  <linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A3039"/><stop offset=".55" stop-color="#151A20"/><stop offset="1" stop-color="#07090D"/></linearGradient>
  <clipPath id="carClip"><path d="M55 470C88 424 148 397 218 389C298 379 376 388 429 410L504 445L567 455C588 459 599 473 598 491V507H54Z"/></clipPath>
  <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-reduced-motion: reduce){.motion{display:none}}</style>
</defs>

<rect width="640" height="620" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="638" height="618" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<rect x="429" y="320" width="3" height="226" fill="url(#beam)" opacity=".78"/>
<rect x="463" y="300" width="14" height="250" fill="url(#beam)" opacity=".12"/>

