    <text x="0" y="105" fill="#FFFFFF" font-size="42" font-weight="840" letter-spacing="-1.4">Evidence over assumptions.</text>
    <text x="0" y="142" fill="#A7ADB7" font-size="15.5">Forum-first community, durable knowledge</text>
    <text x="0" y="166" fill="#A7ADB7" font-size="15.5">and technical tooling.</text>

