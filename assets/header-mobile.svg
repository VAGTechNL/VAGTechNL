      <g transform="translate(266)"><rect width="158" height="30" rx="7" fill="#11151B" stroke="#252A32"/><text x="79" y="19" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">UNKNOWN STAYS UNKNOWN</text></g>
