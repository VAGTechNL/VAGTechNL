<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL mobile GitHub profile hero</title>
<desc id="desc">Mobile VAGTechNL hero with a large 2D technical Polo 6C GTI-inspired hatchback and a restrained body scan animation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080B"/><stop offset=".68" stop-color="#090B0F"/><stop offset="1" stop-color="#10141A"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2=".84"><stop offset="0" stop-color="#39414B"/><stop offset=".3" stop-color="#252B33"/><stop offset=".64" stop-color="#151A20"/><stop offset="1" stop-color="#090C10"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B3742"/><stop offset=".54" stop-color="#151B22"/><stop offset="1" stop-color="#090C10"/></linearGradient>
  <linearGradient id="scanBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E30613" stop-opacity="0"/><stop offset=".4" stop-color="#E30613" stop-opacity=".025"/><stop offset=".5" stop-color="#FF6B73" stop-opacity=".12"/><stop offset=".53" stop-color="#FFFFFF" stop-opacity=".2"/><stop offset=".6" stop-color="#E30613" stop-opacity=".04"/><stop offset="1" stop-color="#E30613" stop-opacity="0"/></linearGradient>
  <radialGradient id="wheel" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#343C46"/><stop offset=".34" stop-color="#1A2026"/><stop offset=".42" stop-color="#090B0E"/><stop offset="1" stop-color="#050607"/></radialGradient>
  <clipPath id="scanClip" clipPathUnits="userSpaceOnUse"><path d="M18 292C26 270 43 256 71 247L142 226C163 220 177 211 192 195L229 160C252 139 287 129 328 129H389C426 129 454 137 476 155L512 189C525 201 536 214 545 230L558 253C563 263 564 276 562 289L559 306H20Z"/><circle cx="142" cy="309" r="39"/><circle cx="454" cy="309" r="39"/></clipPath>
  <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-reduced-motion:reduce){.scan-motion{display:none}}</style>
</defs>

<rect width="640" height="650" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="638" height="648" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>

<g class="sans">
  <g transform="translate(22 20)"><rect width="596" height="56" rx="11" fill="#0D0F13" stroke="#1C2026"/><rect x="14" y="14" width="28" height="28" rx="7" fill="#11151B" stroke="#E30613" stroke-opacity=".76"/><path d="M20 34L26 20H30L36 34" fill="none" stroke="#E30613" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="36" fill="#FFFFFF" font-size="20" font-weight="820">VAGTechNL</text><text x="572" y="34" class="mono" text-anchor="end" fill="#6F7682" font-size="9.2">TECHNIEK · KENNIS · COMMUNITY</text></g>

  <g transform="translate(34 112)"><path d="M0 0H24" stroke="#E30613" stroke-width="2.5"/><text x="36" y="4" class="mono" fill="#A7ADB7" font-size="10.5" font-weight="720" letter-spacing="1.55">TECHNICAL VAG PLATFORM</text><text x="0" y="58" fill="#FFFFFF" font-size="42" font-weight="840" letter-spacing="-1.4">Engineering first.</text><text x="0" y="105" fill="#FFFFFF" font-size="42" font-weight="840" letter-spacing="-1.4">Evidence over assumptions.</text><text x="0" y="142" fill="#A7ADB7" font-size="15.5">Forum-first community, durable knowledge</text><text x="0" y="166" fill="#A7ADB7" font-size="15.5">and technical tooling.</text></g>

  <!-- mobile car is intentionally lower and larger; no red rails or crosshair -->
  <g transform="translate(28 250) scale(1.04)">
    <ellipse cx="293" cy="331" rx="270" ry="17" fill="#040506" opacity=".92"/>
    <path d="M18 292C26 270 43 256 71 247L142 226C163 220 177 211 192 195L229 160C252 139 287 129 328 129H389C426 129 454 137 476 155L512 189C525 201 536 214 545 230L558 253C563 263 564 276 562 289L559 306H20Z" fill="url(#body)" stroke="#414A55" stroke-width="1.4"/>
    <path d="M194 195L232 162C253 145 284 137 326 137H387C418 137 443 144 462 159L499 195Z" fill="url(#glass)" stroke="#333C46" stroke-width="1.1"/>
    <path d="M241 164C261 150 287 144 320 144H339L333 195H208Z" fill="#0A0E12"/><path d="M348 144H385C411 144 432 150 449 162L486 195H341Z" fill="#11171D"/>
    <path d="M339 137L333 306M425 145L444 306" stroke="#080A0D" stroke-width="3"/>
    <path d="M240 203L231 303M343 202L338 303M432 202L449 303" stroke="#343C46" stroke-width="1.1"/>
    <path d="M185 214C236 201 300 198 364 199C430 200 489 208 535 226" fill="none" stroke="#4A5460" stroke-width="1.2" opacity=".76"/>
    <path d="M23 280L61 260L126 238L166 229" fill="none" stroke="#505A65" stroke-width="1.2"/>
    <path d="M29 273L67 260L105 263L75 279Z" fill="#D2DAE2" opacity=".16" stroke="#707A85" stroke-width=".9"/><path d="M37 272L69 262" stroke="#FFFFFF" stroke-opacity=".47" stroke-width="1.2"/>
    <path d="M47 280H126" stroke="#11151A" stroke-width="7"/><path d="M53 280H116" stroke="#E30613" stroke-width="1.8"/>
    <path d="M497 195L521 220L541 238L554 257" fill="none" stroke="#59636F" stroke-width="1.2"/><path d="M529 231L551 241L558 258L540 256Z" fill="#E30613" opacity=".5" stroke="#FF6B73" stroke-opacity=".45" stroke-width=".8"/>
    <path d="M198 204L180 210L198 214L218 211L214 205Z" fill="#252C34" stroke="#5B6570" stroke-width=".8"/>
    <rect x="289" y="219" width="28" height="5" rx="2.5" fill="#272E37" stroke="#59636F" stroke-width=".6"/><rect x="407" y="219" width="28" height="5" rx="2.5" fill="#272E37" stroke="#59636F" stroke-width=".6"/>
    <rect x="133" y="228" width="29" height="13" rx="3" fill="#11151B" stroke="#E30613" stroke-opacity=".58"/><text x="147.5" y="237.5" class="mono" text-anchor="middle" fill="#FF6B73" font-size="7.8" font-weight="800">GTI</text>
    <path d="M76 299H528" stroke="#232A32" stroke-width="8" opacity=".84"/><path d="M24 306C61 306 82 307 102 309M182 310H415M494 309C518 307 539 306 559 306" fill="none" stroke="#252A32"/>
    <circle cx="142" cy="309" r="39" fill="url(#wheel)" stroke="#303740" stroke-width="4.5"/><circle cx="142" cy="309" r="17" fill="#11151B" stroke="#505A65" stroke-width="2.4"/>
    <circle cx="454" cy="309" r="39" fill="url(#wheel)" stroke="#303740" stroke-width="4.5"/><circle cx="454" cy="309" r="17" fill="#11151B" stroke="#505A65" stroke-width="2.4"/>

    <g class="scan-motion" clip-path="url(#scanClip)">
      <g opacity="0">
        <rect x="-112" y="118" width="92" height="240" fill="url(#scanBand)"/>
        <rect x="-66" y="118" width="1.25" height="240" fill="#FF6B73" opacity=".6"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;704 0;704 0" keyTimes="0;.7;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.84;.84;0;0" keyTimes="0;.06;.66;.73;1" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <g transform="translate(34 588)"><text x="0" y="0" class="mono" fill="#6F7682" font-size="9">POLO 6C GTI · 2D TECHNICAL STUDY</text><text x="572" y="0" class="mono" fill="#E30613" font-size="9" text-anchor="end">VAGTECHNL</text><path d="M0 18H572" stroke="#1C2026"/><text x="0" y="40" class="mono" fill="#4F5661" font-size="8.8">FOR DRIVERS | BY ENTHUSIASTS</text><text x="572" y="40" class="mono" fill="#4F5661" font-size="8.8" text-anchor="end">KNOWLEDGE DRIVES FURTHER</text></g>
</g>
</svg>