  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E30613" stop-opacity="0"/><stop offset=".5" stop-color="#FF6B73" stop-opacity=".5"/><stop offset="1" stop-color="#E30613" stop-opacity="0"/></linearGradient>
