  <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-reduced-motion:reduce){.ambient-motion{display:none}}</style>
</defs>
<rect width="640" height="640" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="638" height="638" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>

<rect x="452" y="300" width="2" height="236" fill="url(#beam)" opacity=".28"/><rect x="510" y="326" width="1.5" height="190" fill="url(#beam)" opacity=".18"/>
<g class="ambient-motion"><rect x="452" y="300" width="2" height="236" fill="url(#beam)" opacity=".1"><animate attributeName="opacity" values=".1;.58;.1" dur="6.5s" repeatCount="indefinite"/></rect></g>

