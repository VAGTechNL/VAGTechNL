    <circle cx="161" cy="502" r="34" fill="#06080B" stroke="#2A3038" stroke-width="5"/><circle cx="161" cy="502" r="17" fill="#11151B" stroke="#343A44" stroke-width="3"/>
    <circle cx="493" cy="502" r="34" fill="#06080B" stroke="#2A3038" stroke-width="5"/><circle cx="493" cy="502" r="17" fill="#11151B" stroke="#343A44" stroke-width="3"/>

    <g class="motion" clip-path="url(#carClip)">
