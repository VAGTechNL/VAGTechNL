      <rect x="666" y="215" width="1.5" height="128" fill="#FF6B73" opacity="0"><animate attributeName="x" values="666;1140" dur="8.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.38;.38;0" keyTimes="0;.08;.9;1" dur="8.5s" repeatCount="indefinite"/></rect>
      <rect x="666" y="215" width="34" height="128" fill="#E30613" opacity="0"><animate attributeName="x" values="632;1106" dur="8.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.025;.025;0" keyTimes="0;.08;.9;1" dur="8.5s" repeatCount="indefinite"/></rect>
