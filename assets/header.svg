<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL GitHub profile hero</title>
<desc id="desc">Dark premium VAGTechNL hero with a self-contained vector study of a Volkswagen Polo 6C GTI side profile and a restrained scan animation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080B"/><stop offset=".66" stop-color="#090B0F"/><stop offset="1" stop-color="#10141A"/></linearGradient>
  
  <linearGradient id="dbody" x1="0" y1="0" x2="1" y2=".8">
    <stop offset="0" stop-color="#46505B"/><stop offset=".28" stop-color="#2A3139"/>
    <stop offset=".62" stop-color="#171C22"/><stop offset="1" stop-color="#090C10"/>
  </linearGradient>
  <linearGradient id="dglass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C3742"/><stop offset=".58" stop-color="#141A21"/><stop offset="1" stop-color="#090C10"/>
  </linearGradient>
  <linearGradient id="dscan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E30613" stop-opacity="0"/>
    <stop offset=".42" stop-color="#E30613" stop-opacity=".03"/>
    <stop offset=".495" stop-color="#FF6B73" stop-opacity=".10"/>
    <stop offset=".50" stop-color="#FFFFFF" stop-opacity=".28"/>
    <stop offset=".515" stop-color="#FF6B73" stop-opacity=".10"/>
    <stop offset=".62" stop-color="#E30613" stop-opacity=".03"/>
    <stop offset="1" stop-color="#E30613" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="dwheel" cx="50%" cy="45%" r="55%">
    <stop offset="0" stop-color="#38414A"/><stop offset=".34" stop-color="#171C22"/>
    <stop offset=".43" stop-color="#090B0E"/><stop offset="1" stop-color="#050607"/>
  </radialGradient>
  <mask id="dbodyMask">
    <rect width="580" height="340" fill="black"/>
    <path d="M18 252
             C26 238 43 227 70 220
             L132 204
             C151 199 166 190 181 173
             L218 137
             C241 114 273 104 315 104
             L382 104
             C417 104 444 112 465 127
             L501 157
             C520 173 533 193 541 217
             L555 238
             C561 248 563 259 561 274
             L558 296
             L20 296 Z" fill="white"/>
    <circle cx="122" cy="298" r="42" fill="black"/>
    <circle cx="455" cy="298" r="42" fill="black"/>
  </mask>
  <clipPath id="dscanClip">
    <path d="M18 252
             C26 238 43 227 70 220
             L132 204
             C151 199 166 190 181 173
             L218 137
             C241 114 273 104 315 104
             L382 104
             C417 104 444 112 465 127
             L501 157
             C520 173 533 193 541 217
             L555 238
             C561 248 563 259 561 274
             L558 296
             L20 296 Z"/>
    <circle cx="122" cy="298" r="42"/>
    <circle cx="455" cy="298" r="42"/>
  </clipPath>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media(prefers-reduced-motion:reduce){.scan-motion{display:none}}
  </style>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<g class="sans">
  <g transform="translate(28 22)">
    <rect width="1144" height="54" rx="12" fill="#0D0F13" stroke="#1C2026"/>
    <rect x="14" y="13" width="28" height="28" rx="7" fill="#11151B" stroke="#E30613" stroke-opacity=".76"/>
    <path d="M20 33L26 19H30L36 33" fill="none" stroke="#E30613" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="35" fill="#FFFFFF" font-size="19" font-weight="820">VAGTechNL</text>
    <text x="186" y="34" class="mono" fill="#6F7682" font-size="10" letter-spacing="1.45">TECHNIEK · KENNIS · COMMUNITY</text>
    <g transform="translate(808)" font-size="10.5" font-weight="760" letter-spacing=".65">
      <text x="0" y="33" fill="#FFFFFF">FORUM</text><text x="74" y="33" fill="#A7ADB7">KENNISBANK</text><text x="176" y="33" fill="#A7ADB7">CODEGARAGE</text><text x="285" y="33" fill="#A7ADB7">TOOLS</text><path d="M0 52H38" stroke="#E30613" stroke-width="2"/>
    </g>
  </g>
  <g transform="translate(52 118)">
    <path d="M0 0H26" stroke="#E30613" stroke-width="2.5"/>
    <text x="38" y="4" class="mono" fill="#A7ADB7" font-size="11" font-weight="720" letter-spacing="1.85">TECHNICAL VAG PLATFORM</text>
    <text x="0" y="63" fill="#FFFFFF" font-size="49" font-weight="840" letter-spacing="-1.8">Engineering first.</text>
    <text x="0" y="117" fill="#FFFFFF" font-size="49" font-weight="840" letter-spacing="-1.8">Evidence over assumptions.</text>
    <text x="0" y="157" fill="#A7ADB7" font-size="16.5">Forum-first community, durable knowledge and technical tooling.</text>
    <text x="0" y="184" fill="#6F7682" font-size="13">Volkswagen Group · diagnostics · coding · retrofits · software</text>
    <g transform="translate(0 222)">
      <rect width="100" height="28" rx="7" fill="#11151B" stroke="#252A32"/><text x="50" y="18" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">FORUM FIRST</text>
      <g transform="translate(112)"><rect width="122" height="28" rx="7" fill="#11151B" stroke="#252A32"/><text x="61" y="18" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">EVIDENCE DRIVEN</text></g>
      <g transform="translate(246)"><rect width="140" height="28" rx="7" fill="#11151B" stroke="#252A32"/><text x="70" y="18" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">UNKNOWN STAYS UNKNOWN</text></g>
    </g>
  </g>
  <g transform="translate(607 39)">
    
  <g class="car">
    <ellipse cx="290" cy="321" rx="270" ry="17" fill="#040506" opacity=".92"/>

    <!-- body with wheel-arch cutouts -->
    <g mask="url(#dbodyMask)">
      <path d="M18 252
               C26 238 43 227 70 220
               L132 204
               C151 199 166 190 181 173
               L218 137
               C241 114 273 104 315 104
               L382 104
               C417 104 444 112 465 127
               L501 157
               C520 173 533 193 541 217
               L555 238
               C561 248 563 259 561 274
               L558 296
               L20 296 Z"
            fill="url(#dbody)" stroke="#4C5662" stroke-width="1.5"/>
    </g>

    <!-- roof / greenhouse -->
    <path d="M187 173L222 140
             C244 120 273 112 313 112
             H379
             C407 112 430 119 448 132
             L487 168
             L474 174
             H199Z"
          fill="url(#dglass)" stroke="#3A444E" stroke-width="1.1"/>
    <path d="M229 143C248 126 273 119 306 119H332L327 172H197Z" fill="#0A0E12"/>
    <path d="M341 119H377C400 119 418 124 434 136L474 172H336Z" fill="#11171D"/>

    <!-- roofline, spoiler, antenna -->
    <path d="M219 136C242 112 273 102 315 102H382C416 102 443 110 466 126"
          fill="none" stroke="#69747F" stroke-width="1.3" opacity=".7"/>
    <path d="M478 136L503 145L491 153" fill="none" stroke="#5B6672" stroke-width="1.2"/>
    <path d="M401 103L409 88L413 103" fill="none" stroke="#59636E" stroke-width="1.1"/>

    <!-- pillars / 5-door structure -->
    <path d="M336 112L330 292M422 121L440 292" stroke="#080A0D" stroke-width="3"/>
    <path d="M228 181L220 290M338 180L333 290M430 180L447 290" stroke="#353D46" stroke-width="1.15"/>
    <path d="M173 193C228 181 295 178 362 179C432 180 491 188 536 206"
          fill="none" stroke="#515C68" stroke-width="1.2" opacity=".72"/>

    <!-- short Polo front -->
    <path d="M21 244L53 228L119 208L161 201" fill="none" stroke="#58636F" stroke-width="1.25"/>
    <path d="M27 239L63 228L101 231L75 246Z"
          fill="#D2DAE2" opacity=".17" stroke="#707A85" stroke-width=".9"/>
    <path d="M36 238L66 229" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.15"/>
    <path d="M42 248H121" stroke="#10141A" stroke-width="7"/>
    <path d="M49 248H115" stroke="#E30613" stroke-width="1.8"/>

    <!-- rear hatch / taillight -->
    <path d="M488 168L512 188L534 212L549 236" fill="none" stroke="#5D6874" stroke-width="1.2"/>
    <path d="M524 205L548 214L556 236L536 232Z"
          fill="#E30613" opacity=".56" stroke="#FF6B73" stroke-opacity=".42" stroke-width=".8"/>

    <!-- mirror -->
    <path d="M190 184L172 190L190 195L215 192L209 185Z"
          fill="#252C34" stroke="#5D6772" stroke-width=".8"/>

    <!-- handles -->
    <rect x="281" y="196" width="28" height="5" rx="2.5" fill="#272E37" stroke="#59636F" stroke-width=".6"/>
    <rect x="402" y="196" width="28" height="5" rx="2.5" fill="#272E37" stroke="#59636F" stroke-width=".6"/>

    <!-- GTI detail -->
    <rect x="128" y="207" width="30" height="13" rx="3" fill="#11151B" stroke="#E30613" stroke-opacity=".62"/>
    <text x="143" y="216.3" class="mono" text-anchor="middle" fill="#FF6B73" font-size="7.8" font-weight="800">GTI</text>

    <!-- shoulder / lower sculpting -->
    <path d="M47 240C126 214 208 197 292 193C391 188 475 195 535 216"
          fill="none" stroke="#77818C" stroke-width="1.3" opacity=".22"/>
    <path d="M77 286H528" stroke="#232A32" stroke-width="8" opacity=".86"/>

    <!-- wheel arches -->
    <path d="M78 296C80 266 96 250 122 250C148 250 165 266 166 296"
          fill="none" stroke="#3F4852" stroke-width="1.4"/>
    <path d="M411 296C413 266 429 250 455 250C481 250 498 266 499 296"
          fill="none" stroke="#3F4852" stroke-width="1.4"/>

    <!-- wheels -->
    <circle cx="122" cy="298" r="41" fill="url(#dwheel)" stroke="#303740" stroke-width="4.5"/>
    <circle cx="122" cy="298" r="18" fill="#11151B" stroke="#505A65" stroke-width="2.4"/>
    <path d="M122 282V314M106 298H138M111 287L133 309M133 287L111 309" stroke="#7B8691" stroke-opacity=".58" stroke-width="1.1"/>
    <circle cx="455" cy="298" r="41" fill="url(#dwheel)" stroke="#303740" stroke-width="4.5"/>
    <circle cx="455" cy="298" r="18" fill="#11151B" stroke="#505A65" stroke-width="2.4"/>
    <path d="M455 282V314M439 298H471M444 287L466 309M466 287L444 309" stroke="#7B8691" stroke-opacity=".58" stroke-width="1.1"/>

    <!-- subtle red brakes -->
    <path d="M111 289L115 307" stroke="#E30613" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M444 289L448 307" stroke="#E30613" stroke-width="3.6" stroke-linecap="round"/>

    <!-- floor -->
    <path d="M22 307H558" stroke="#252A32" stroke-width="1"/>

    <!-- scan animation -->
    <g class="scan-motion" clip-path="url(#dscanClip)">
      <g opacity="0">
        <rect x="-110" y="95" width="92" height="240" fill="url(#dscan)"/>
        <rect x="-63" y="95" width="1.2" height="240" fill="#FFFFFF" opacity=".52"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;710 0;710 0" keyTimes="0;.70;1" dur="8.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.88;.88;0;0" keyTimes="0;.06;.66;.73;1" dur="8.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="558" y="354" class="mono" text-anchor="end" fill="#4F5661" font-size="8.7" letter-spacing="1.15">POLO 6C GTI · VECTOR STUDY</text>
  </g>
  </g>
</g>
<text x="52" y="404" class="mono" fill="#4F5661" font-size="9.5" letter-spacing="1">FOR DRIVERS | BY ENTHUSIASTS</text>
<text x="1148" y="404" class="mono" fill="#4F5661" font-size="9.5" text-anchor="end" letter-spacing="1">KNOWLEDGE DRIVES FURTHER</text>
</svg>