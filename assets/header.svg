<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL GitHub profile hero</title>
<desc id="desc">Dark premium VAGTechNL hero with a restrained 2D technical illustration of a Volkswagen Polo 6C GTI-inspired five-door hatchback.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06080B"/>
    <stop offset=".62" stop-color="#090B0F"/>
    <stop offset="1" stop-color="#11151B"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2=".8">
    <stop offset="0" stop-color="#303741"/>
    <stop offset=".28" stop-color="#242A32"/>
    <stop offset=".64" stop-color="#14191F"/>
    <stop offset="1" stop-color="#0A0D11"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#28333E"/>
    <stop offset=".6" stop-color="#12181E"/>
    <stop offset="1" stop-color="#090C10"/>
  </linearGradient>
  <linearGradient id="scanBand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E30613" stop-opacity="0"/>
    <stop offset=".38" stop-color="#E30613" stop-opacity=".05"/>
    <stop offset=".5" stop-color="#FF6B73" stop-opacity=".24"/>
    <stop offset=".62" stop-color="#E30613" stop-opacity=".05"/>
    <stop offset="1" stop-color="#E30613" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="carScanClip" clipPathUnits="userSpaceOnUse">
    <path d="M39 310 C49 289 68 276 100 270 L147 260 C163 255 176 247 190 232 L215 210 C237 192 267 184 301 184 L371 184 C406 184 431 190 450 205 L483 231 C495 241 505 251 516 263 L532 274 C542 281 548 291 549 307 L548 326 L40 326 Z"/>
    <circle cx="148" cy="326" r="34"/>
    <circle cx="449" cy="326" r="34"/>
  </clipPath>
  <radialGradient id="wheel" cx="50%" cy="45%" r="55%">
    <stop offset="0" stop-color="#303741"/>
    <stop offset=".35" stop-color="#151A20"/>
    <stop offset=".42" stop-color="#090B0E"/>
    <stop offset="1" stop-color="#050607"/>
  </radialGradient>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media(prefers-reduced-motion:reduce){.scan-motion{display:none}}
  </style>
</defs>

<rect width="1200" height="420" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>


<g class="sans">
  <g transform="translate(28 22)">
    <rect width="1144" height="54" rx="12" fill="#0D0F13" stroke="#1C2026"/>
    <rect x="14" y="13" width="28" height="28" rx="7" fill="#11151B" stroke="#E30613" stroke-opacity=".76"/>
    <path d="M20 33L26 19H30L36 33" fill="none" stroke="#E30613" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="35" fill="#FFFFFF" font-size="19" font-weight="820">VAGTechNL</text>
    <text x="186" y="34" class="mono" fill="#6F7682" font-size="10" letter-spacing="1.45">TECHNIEK · KENNIS · COMMUNITY</text>
    <g transform="translate(808)" font-size="10.5" font-weight="760" letter-spacing=".65">
      <text x="0" y="33" fill="#FFFFFF">FORUM</text>
      <text x="74" y="33" fill="#A7ADB7">KENNISBANK</text>
      <text x="176" y="33" fill="#A7ADB7">CODEGARAGE</text>
      <text x="285" y="33" fill="#A7ADB7">TOOLS</text>
      <path d="M0 52H38" stroke="#E30613" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(52 118)">
    <path d="M0 0H26" stroke="#E30613" stroke-width="2.5"/>
    <text x="38" y="4" class="mono" fill="#A7ADB7" font-size="11" font-weight="720" letter-spacing="1.85">TECHNICAL VAG PLATFORM</text>
    <text x="0" y="63" fill="#FFFFFF" font-size="49" font-weight="840" letter-spacing="-1.8">Engineering first.</text>
    <text x="0" y="117" fill="#FFFFFF" font-size="49" font-weight="840" letter-spacing="-1.8">Evidence over assumptions.</text>
    <text x="0" y="157" fill="#A7ADB7" font-size="16.5">Forum-first community, durable knowledge and technical tooling.</text>
    <text x="0" y="184" fill="#6F7682" font-size="13">Volkswagen Group · diagnostics · coding · retrofits · software</text>

    <g transform="translate(0 222)">
      <rect width="100" height="28" rx="7" fill="#11151B" stroke="#252A32"/>
      <text x="50" y="18" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">FORUM FIRST</text>
      <g transform="translate(112)">
        <rect width="122" height="28" rx="7" fill="#11151B" stroke="#252A32"/>
        <text x="61" y="18" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">EVIDENCE DRIVEN</text>
      </g>
      <g transform="translate(246)">
        <rect width="140" height="28" rx="7" fill="#11151B" stroke="#252A32"/>
        <text x="70" y="18" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">UNKNOWN STAYS UNKNOWN</text>
      </g>
    </g>
  </g>

  <!-- 2D Polo 6C GTI-inspired side profile, aligned as a right-side visual anchor -->
  <g transform="translate(628 0)">
    <ellipse cx="284" cy="350" rx="250" ry="16" fill="#040506" opacity=".92"/>
    <path d="M39 310
             C49 289 68 276 100 270
             L147 260
             C163 255 176 247 190 232
             L215 210
             C237 192 267 184 301 184
             L371 184
             C406 184 431 190 450 205
             L483 231
             C495 241 505 251 516 263
             L532 274
             C542 281 548 291 549 307
             L548 326
             L40 326 Z"
          fill="url(#body)" stroke="#3B434D" stroke-width="1.3"/>

    <!-- compact five-door greenhouse -->
    <path d="M196 238L221 215
             C241 198 266 191 299 191
             L366 191
             C396 191 420 197 438 211
             L471 238Z"
          fill="url(#glass)" stroke="#303842" stroke-width="1"/>
    <path d="M227 216C245 202 268 197 296 197L322 197L316 238H204Z" fill="#0A0E12"/>
    <path d="M330 197H365C391 197 411 202 428 214L458 238H324Z" fill="#11171D"/>

    <!-- pillars and door structure -->
    <path d="M322 191L316 326M404 198L421 326" stroke="#080A0D" stroke-width="3"/>
    <path d="M233 244L223 324M326 244L320 324M414 244L429 324" stroke="#343B45" stroke-width="1"/>
    <path d="M181 255C231 243 294 240 356 241C424 242 474 249 517 267" fill="none" stroke="#48515D" stroke-width="1.1" opacity=".75"/>

    <!-- high hatchback rear and short overhang -->
    <path d="M468 238L492 259L516 271L536 285" fill="none" stroke="#505965" stroke-width="1.1"/>
    <path d="M517 270L540 279L546 296" fill="none" stroke="#E30613" stroke-opacity=".5" stroke-width="2"/>

    <!-- short Polo nose -->
    <path d="M42 302L74 282L136 267L173 262" fill="none" stroke="#4A535E" stroke-width="1.2"/>
    <path d="M46 297L82 287L111 289L85 302Z" fill="#C9D2DB" opacity=".16" stroke="#6A7480" stroke-width=".8"/>
    <path d="M52 296L83 288" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1.1"/>

    <!-- GTI side cue -->
    <rect x="147" y="259" width="28" height="13" rx="3" fill="#11151B" stroke="#E30613" stroke-opacity=".6"/>
    <text x="161" y="268.5" class="mono" text-anchor="middle" fill="#FF6B73" font-size="7.8" font-weight="800">GTI</text>

    <!-- handles -->
    <rect x="281" y="257" width="27" height="5" rx="2.5" fill="#272E37" stroke="#59636F" stroke-width=".6"/>
    <rect x="398" y="257" width="27" height="5" rx="2.5" fill="#272E37" stroke="#59636F" stroke-width=".6"/>

    <!-- sill and restrained red accent -->
    <path d="M87 319H510" stroke="#232932" stroke-width="8" opacity=".82"/>

    <!-- wheels -->
    <circle cx="148" cy="326" r="34" fill="url(#wheel)" stroke="#303740" stroke-width="4"/>
    <circle cx="148" cy="326" r="15" fill="#11151B" stroke="#4D5661" stroke-width="2.2"/>
    <path d="M148 312V340M134 326H162M138 316L158 336M158 316L138 336" stroke="#737D88" stroke-opacity=".52" stroke-width="1"/>

    <circle cx="449" cy="326" r="34" fill="url(#wheel)" stroke="#303740" stroke-width="4"/>
    <circle cx="449" cy="326" r="15" fill="#11151B" stroke="#4D5661" stroke-width="2.2"/>
    <path d="M449 312V340M435 326H463M439 316L459 336M459 316L439 336" stroke="#737D88" stroke-opacity=".52" stroke-width="1"/>

    <!-- grounded outline -->
    <path d="M40 326C72 326 93 326 113 327M183 327H414M484 327C507 326 528 326 548 326" fill="none" stroke="#252A32"/>

    <!-- scan is clipped to the vehicle: no page-wide laser or crosshair -->
    <g class="scan-motion" clip-path="url(#carScanClip)">
      <g opacity="0">
        <rect x="-96" y="178" width="72" height="184" fill="url(#scanBand)"/>
        <rect x="-61" y="178" width="1.4" height="184" rx=".7" fill="#FF6B73" opacity=".72"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;654 0;654 0" keyTimes="0;.68;1" dur="8.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;.9;0;0" keyTimes="0;.06;.64;.7;1" dur="8.4s" repeatCount="indefinite"/>
      </g>
    </g>
    <g class="scan-motion" opacity="0">
      <text x="40" y="360" class="mono" fill="#6F7682" font-size="8.2" letter-spacing="1.1">PROFILE SCAN</text>
      <path d="M118 357H170" stroke="#E30613" stroke-width="1"/>
      <animate attributeName="opacity" values="0;.65;.65;0;0" keyTimes="0;.08;.62;.72;1" dur="8.4s" repeatCount="indefinite"/>
    </g>

    <!-- tiny technical signature -->
    <text x="548" y="374" class="mono" text-anchor="end" fill="#4F5661" font-size="8.8" letter-spacing="1.2">POLO 6C GTI · 2D TECHNICAL STUDY</text>
  </g>
</g>

<text x="52" y="394" class="mono" fill="#4F5661" font-size="9.5" letter-spacing="1">FOR DRIVERS | BY ENTHUSIASTS</text>
<text x="1148" y="394" class="mono" fill="#4F5661" font-size="9.5" text-anchor="end" letter-spacing="1">KNOWLEDGE DRIVES FURTHER</text>
</svg>