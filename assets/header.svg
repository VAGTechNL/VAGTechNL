  <linearGradient id="redBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E30613" stop-opacity="0"/><stop offset=".18" stop-color="#E30613" stop-opacity=".18"/><stop offset=".52" stop-color="#FF6B73" stop-opacity=".78"/><stop offset=".8" stop-color="#E30613" stop-opacity=".18"/><stop offset="1" stop-color="#E30613" stop-opacity="0"/></linearGradient>
  <linearGradient id="carBody" x1="0" y1="0" x2="1" y2=".9"><stop offset="0" stop-color="#272E38"/><stop offset=".42" stop-color="#171B21"/><stop offset=".76" stop-color="#0E1116"/><stop offset="1" stop-color="#06080B"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27313B"/><stop offset=".55" stop-color="#11161C"/><stop offset="1" stop-color="#090C10"/></linearGradient>
  <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151A21" stop-opacity=".62"/><stop offset="1" stop-color="#07080B" stop-opacity="0"/></linearGradient>
