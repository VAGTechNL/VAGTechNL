<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL GitHub profile hero</title>
<desc id="desc">Dark premium VAGTechNL hero with a large 2D technical Polo 6C GTI-inspired five-door hatchback and a restrained body scan animation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06080B"/>
    <stop offset=".66" stop-color="#090B0F"/>
    <stop offset="1" stop-color="#10141A"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2=".84">
    <stop offset="0" stop-color="#39414B"/>
    <stop offset=".28" stop-color="#252B33"/>
    <stop offset=".64" stop-color="#151A20"/>
    <stop offset="1" stop-color="#090C10"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2B3742"/>
    <stop offset=".54" stop-color="#151B22"/>
    <stop offset="1" stop-color="#090C10"/>
  </linearGradient>
  <linearGradient id="scanBand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E30613" stop-opacity="0"/>
    <stop offset=".38" stop-color="#E30613" stop-opacity=".025"/>
    <stop offset=".49" stop-color="#FF6B73" stop-opacity=".13"/>
    <stop offset=".52" stop-color="#FFFFFF" stop-opacity=".22"/>
    <stop offset=".55" stop-color="#FF6B73" stop-opacity=".11"/>
    <stop offset=".7" stop-color="#E30613" stop-opacity=".025"/>
    <stop offset="1" stop-color="#E30613" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="wheel" cx="50%" cy="45%" r="55%">
    <stop offset="0" stop-color="#343C46"/>
    <stop offset=".34" stop-color="#1A2026"/>
    <stop offset=".42" stop-color="#090B0E"/>
    <stop offset="1" stop-color="#050607"/>
  </radialGradient>
  <clipPath id="scanClip" clipPathUnits="userSpaceOnUse">
    <path d="M18 292C26 270 43 256 71 247L142 226C163 220 177 211 192 195L229 160C252 139 287 129 328 129H389C426 129 454 137 476 155L512 189C525 201 536 214 545 230L558 253C563 263 564 276 562 289L559 306H20Z"/>
    <circle cx="142" cy="309" r="39"/>
    <circle cx="454" cy="309" r="39"/>
  </clipPath>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media(prefers-reduced-motion:reduce){.scan-motion{display:none}}
  </style>
</defs>

<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>

<g class="sans">
  <g transform="translate(28 22)">
    <rect width="1144" height="54" rx="12" fill="#0D0F13" stroke="#1C2026"/>
    <rect x="14" y="13" width="28" height="28" rx="7" fill="#11151B" stroke="#E30613" stroke-opacity=".76"/>
    <path d="M20 33L26 19H30L36 33" fill="none" stroke="#E30613" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="35" fill="#FFFFFF" font-size="19" font-weight="820">VAGTechNL</text>
    <text x="186" y="34" class="mono" fill="#6F7682" font-size="10" letter-spacing="1.45">TECHNIEK · KENNIS · COMMUNITY</text>
    <g transform="translate(808)" font-size="10.5" font-weight="760" letter-spacing=".65">
      <text x="0" y="33" fill="#FFFFFF">FORUM</text>
      <text x="74" y="33" fill="#A7ADB7">KENNISBANK</text>
      <text x="176" y="33" fill="#A7ADB7">CODEGARAGE</text>
      <text x="285" y="33" fill="#A7ADB7">TOOLS</text>
      <path d="M0 52H38" stroke="#E30613" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(52 118)">
    <path d="M0 0H26" stroke="#E30613" stroke-width="2.5"/>
    <text x="38" y="4" class="mono" fill="#A7ADB7" font-size="11" font-weight="720" letter-spacing="1.85">TECHNICAL VAG PLATFORM</text>
    <text x="0" y="63" fill="#FFFFFF" font-size="49" font-weight="840" letter-spacing="-1.8">Engineering first.</text>
    <text x="0" y="117" fill="#FFFFFF" font-size="49" font-weight="840" letter-spacing="-1.8">Evidence over assumptions.</text>
    <text x="0" y="157" fill="#A7ADB7" font-size="16.5">Forum-first community, durable knowledge and technical tooling.</text>
    <text x="0" y="184" fill="#6F7682" font-size="13">Volkswagen Group · diagnostics · coding · retrofits · software</text>

    <g transform="translate(0 222)">
      <rect width="100" height="28" rx="7" fill="#11151B" stroke="#252A32"/><text x="50" y="18" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">FORUM FIRST</text>
      <g transform="translate(112)"><rect width="122" height="28" rx="7" fill="#11151B" stroke="#252A32"/><text x="61" y="18" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">EVIDENCE DRIVEN</text></g>
      <g transform="translate(246)"><rect width="140" height="28" rx="7" fill="#11151B" stroke="#252A32"/><text x="70" y="18" class="mono" text-anchor="middle" fill="#E6E8EB" font-size="9.5">UNKNOWN STAYS UNKNOWN</text></g>
    </g>
  </g>

  <!-- large 2D Polo 6C GTI study; no crosshair or decorative red rails -->
  <g transform="translate(606 30)">
    <ellipse cx="293" cy="331" rx="270" ry="17" fill="#040506" opacity=".92"/>

    <path d="M18 292C26 270 43 256 71 247L142 226C163 220 177 211 192 195L229 160C252 139 287 129 328 129H389C426 129 454 137 476 155L512 189C525 201 536 214 545 230L558 253C563 263 564 276 562 289L559 306H20Z"
          fill="url(#body)" stroke="#414A55" stroke-width="1.4"/>

    <!-- roof and greenhouse -->
    <path d="M194 195L232 162C253 145 284 137 326 137H387C418 137 443 144 462 159L499 195Z"
          fill="url(#glass)" stroke="#333C46" stroke-width="1.1"/>
    <path d="M241 164C261 150 287 144 320 144H339L333 195H208Z" fill="#0A0E12"/>
    <path d="M348 144H385C411 144 432 150 449 162L486 195H341Z" fill="#11171D"/>

    <!-- hatchback pillars / five-door structure -->
    <path d="M339 137L333 306M425 145L444 306" stroke="#080A0D" stroke-width="3"/>
    <path d="M240 203L231 303M343 202L338 303M432 202L449 303" stroke="#343C46" stroke-width="1.1"/>
    <path d="M185 214C236 201 300 198 364 199C430 200 489 208 535 226" fill="none" stroke="#4A5460" stroke-width="1.2" opacity=".76"/>

    <!-- short Polo nose / headlamp -->
    <path d="M23 280L61 260L126 238L166 229" fill="none" stroke="#505A65" stroke-width="1.2"/>
    <path d="M29 273L67 260L105 263L75 279Z" fill="#D2DAE2" opacity=".16" stroke="#707A85" stroke-width=".9"/>
    <path d="M37 272L69 262" stroke="#FFFFFF" stroke-opacity=".47" stroke-width="1.2"/>
    <path d="M47 280H126" stroke="#11151A" stroke-width="7"/>
    <path d="M53 280H116" stroke="#E30613" stroke-width="1.8"/>

    <!-- upright hatch / rear lamp -->
    <path d="M497 195L521 220L541 238L554 257" fill="none" stroke="#59636F" stroke-width="1.2"/>
    <path d="M529 231L551 241L558 258L540 256Z" fill="#E30613" opacity=".5" stroke="#FF6B73" stroke-opacity=".45" stroke-width=".8"/>

    <!-- mirror, handles, GTI badge -->
    <path d="M198 204L180 210L198 214L218 211L214 205Z" fill="#252C34" stroke="#5B6570" stroke-width=".8"/>
    <rect x="289" y="219" width="28" height="5" rx="2.5" fill="#272E37" stroke="#59636F" stroke-width=".6"/>
    <rect x="407" y="219" width="28" height="5" rx="2.5" fill="#272E37" stroke="#59636F" stroke-width=".6"/>
    <rect x="133" y="228" width="29" height="13" rx="3" fill="#11151B" stroke="#E30613" stroke-opacity=".58"/>
    <text x="147.5" y="237.5" class="mono" text-anchor="middle" fill="#FF6B73" font-size="7.8" font-weight="800">GTI</text>

    <!-- lower body -->
    <path d="M76 299H528" stroke="#232A32" stroke-width="8" opacity=".84"/>
    <path d="M24 306C61 306 82 307 102 309M182 310H415M494 309C518 307 539 306 559 306" fill="none" stroke="#252A32"/>

    <!-- wheels -->
    <circle cx="142" cy="309" r="39" fill="url(#wheel)" stroke="#303740" stroke-width="4.5"/>
    <circle cx="142" cy="309" r="17" fill="#11151B" stroke="#505A65" stroke-width="2.4"/>
    <path d="M142 294V324M127 309H157M131 298L153 320M153 298L131 320" stroke="#7A8590" stroke-opacity=".56" stroke-width="1.1"/>
    <circle cx="454" cy="309" r="39" fill="url(#wheel)" stroke="#303740" stroke-width="4.5"/>
    <circle cx="454" cy="309" r="17" fill="#11151B" stroke="#505A65" stroke-width="2.4"/>
    <path d="M454 294V324M439 309H469M443 298L465 320M465 298L443 320" stroke="#7A8590" stroke-opacity=".56" stroke-width="1.1"/>

    <!-- one scan effect only, clipped to vehicle -->
    <g class="scan-motion" clip-path="url(#scanClip)">
      <g opacity="0">
        <rect x="-112" y="118" width="92" height="240" fill="url(#scanBand)"/>
        <rect x="-66" y="118" width="1.25" height="240" fill="#FF6B73" opacity=".62"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;704 0;704 0" keyTimes="0;.7;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.86;.86;0;0" keyTimes="0;.06;.66;.73;1" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="558" y="365" class="mono" text-anchor="end" fill="#4F5661" font-size="8.8" letter-spacing="1.2">POLO 6C GTI · 2D TECHNICAL STUDY</text>
  </g>
</g>

<text x="52" y="404" class="mono" fill="#4F5661" font-size="9.5" letter-spacing="1">FOR DRIVERS | BY ENTHUSIASTS</text>
<text x="1148" y="404" class="mono" fill="#4F5661" font-size="9.5" text-anchor="end" letter-spacing="1">KNOWLEDGE DRIVES FURTHER</text>
</svg>