  <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.motion{opacity:1}@media (prefers-reduced-motion: reduce){.motion{display:none}}</style>
</defs>

<rect width="1200" height="420" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>

