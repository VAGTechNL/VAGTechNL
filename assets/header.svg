    <circle cx="1040" cy="329" r="34" fill="#06080B" stroke="#2A3038" stroke-width="5"/><circle cx="1040" cy="329" r="17" fill="#11151B" stroke="#343A44" stroke-width="3"/>
    <path d="M656 323C682 323 705 324 724 328M794 329H1005M1075 328C1102 327 1124 327 1148 328" fill="none" stroke="#252A32"/>
