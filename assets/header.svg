<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">VAGTechNL GitHub profile header</title>
  <desc id="desc">Dark technical VAGTechNL banner with red accent, module nodes, diagnostics theme, rotating technical focus and subtle network signal animation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080B"/>
      <stop offset="1" stop-color="#0D0F13"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="82%" cy="34%" r="54%">
      <stop offset="0" stop-color="#E10600" stop-opacity="0.18"/>
      <stop offset="0.42" stop-color="#E10600" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#E10600" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A7ADB7" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .focus { opacity: 0; animation: focusCycle 16s ease-in-out infinite; }
    .f1 { animation-delay: 0s; opacity: 1; }
    .f2 { animation-delay: 4s; }
    .f3 { animation-delay: 8s; }
    .f4 { animation-delay: 12s; }

    .signal {
      fill: none;
      stroke: #FF2A23;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 7 42;
      opacity: 0;
      animation: signalTravel 1.65s linear infinite, signalGate 16s linear infinite;
    }
    .route-a { animation-delay: 0s, 0s; }
    .route-b { animation-delay: .45s, 0s; }
    .route-c { animation-delay: .9s, 0s; }
    .route-d { animation-delay: 0s, -8s; }
    .route-e { animation-delay: .45s, -8s; }

    .core-node { animation: corePulse 4s ease-in-out infinite; }
    .core-node-soft { animation: corePulseSoft 4s ease-in-out infinite; animation-delay: .55s; }

    @keyframes focusCycle {
      0%, 20% { opacity: 1; }
      24%, 100% { opacity: 0; }
    }
    @keyframes signalTravel {
      to { stroke-dashoffset: -49; }
    }
    @keyframes signalGate {
      0%, 3% { opacity: 0; }
      7%, 19% { opacity: .95; }
      23%, 49% { opacity: 0; }
      53%, 65% { opacity: .95; }
      69%, 100% { opacity: 0; }
    }
    @keyframes corePulse {
      0%, 100% { stroke-opacity: .45; }
      50% { stroke-opacity: 1; }
    }
    @keyframes corePulseSoft {
      0%, 100% { stroke-opacity: .32; }
      50% { stroke-opacity: .72; }
    }

    @media (prefers-reduced-motion: reduce) {
      .focus { animation: none; opacity: 0; }
      .f1 { opacity: 1; }
      .signal { animation: none; opacity: 0; }
      .core-node, .core-node-soft { animation: none; }
    }
  </style>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="28" fill="url(#redGlow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#1C2026" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(64 58)">
      <rect x="0" y="0" width="144" height="30" rx="15" fill="#14171C" stroke="#1C2026"/>
      <circle cx="18" cy="15" r="4" fill="#E10600"/>
      <text x="31" y="20" fill="#A7ADB7" font-size="12" font-weight="700" letter-spacing="1.8">VAGTECHNL</text>

      <text x="0" y="112" fill="#FFFFFF" font-size="64" font-weight="800" letter-spacing="-2">VAGTechNL</text>
      <text x="0" y="151" fill="#A7ADB7" font-size="21" font-weight="500">Diagnostics · Retrofits · Coding · Module Research · Software</text>

      <g transform="translate(0 205)">
        <rect width="472" height="86" rx="18" fill="#14171C" stroke="#1C2026"/>
        <rect x="18" y="18" width="3" height="50" rx="1.5" fill="#E10600"/>
        <text x="38" y="38" fill="#6F7682" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ACTIVE FOCUS</text>
        <g transform="translate(38 63)" fill="#E6E8EB" font-size="15" font-weight="650">
          <text class="focus f1">Diagnostics &amp; vehicle communication</text>
          <text class="focus f2">OEM retrofits, coding &amp; datasets</text>
          <text class="focus f3">CAN · UDS · ODX · MQB</text>
          <text class="focus f4">Evidence-driven research &amp; tooling</text>
        </g>
      </g>
    </g>

    <g transform="translate(692 52)">
      <rect width="444" height="316" rx="24" fill="#0D0F13" stroke="#1C2026"/>
      <rect x="20" y="18" width="404" height="30" rx="9" fill="#14171C" stroke="#1C2026"/>
      <circle cx="39" cy="33" r="4" fill="#E10600"/>
      <circle cx="54" cy="33" r="4" fill="#6F7682" opacity="0.65"/>
      <circle cx="69" cy="33" r="4" fill="#6F7682" opacity="0.35"/>
      <text x="92" y="38" fill="#6F7682" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">diagnostics://mqb/network</text>

      <g stroke="#6F7682" stroke-opacity="0.32" stroke-width="1.5" fill="none">
        <path d="M136 128H183"/>
        <path d="M261 128H308"/>
        <path d="M222 154V211"/>
        <path d="M183 242H157"/>
        <path d="M261 242H287"/>
      </g>

      <g stroke="#E10600" stroke-opacity="0.24" stroke-width="2" fill="none">
        <path d="M136 128H183"/>
        <path d="M222 154V211"/>
      </g>

      <g aria-hidden="true">
        <path class="signal route-a" d="M136 128H183"/>
        <path class="signal route-b" d="M222 154V211"/>
        <path class="signal route-c" d="M183 242H157"/>
        <path class="signal route-d" d="M261 128H308"/>
        <path class="signal route-e" d="M261 242H287"/>
      </g>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
        <g transform="translate(58 102)">
          <rect width="78" height="52" rx="12" fill="#14171C" stroke="#252A32"/>
          <text x="39" y="24" fill="#E6E8EB">5F</text>
          <text x="39" y="40" fill="#6F7682" font-size="9">MIB</text>
        </g>
        <g transform="translate(183 102)">
          <rect class="core-node" width="78" height="52" rx="12" fill="#14171C" stroke="#E10600" stroke-opacity="0.7"/>
          <text x="39" y="24" fill="#E6E8EB">GW</text>
          <text x="39" y="40" fill="#FF2A23" font-size="9">CAN</text>
        </g>
        <g transform="translate(308 102)">
          <rect width="78" height="52" rx="12" fill="#14171C" stroke="#252A32"/>
          <text x="39" y="24" fill="#E6E8EB">01</text>
          <text x="39" y="40" fill="#6F7682" font-size="9">ECU</text>
        </g>
        <g transform="translate(183 211)">
          <rect class="core-node-soft" width="78" height="52" rx="12" fill="#14171C" stroke="#E10600" stroke-opacity="0.48"/>
          <text x="39" y="24" fill="#E6E8EB">UDS</text>
          <text x="39" y="40" fill="#FF2A23" font-size="9">ODX</text>
        </g>
        <g transform="translate(79 217)">
          <rect width="78" height="52" rx="12" fill="#14171C" stroke="#252A32"/>
          <text x="39" y="24" fill="#E6E8EB">6C</text>
          <text x="39" y="40" fill="#6F7682" font-size="9">RVC</text>
        </g>
        <g transform="translate(287 217)">
          <rect width="78" height="52" rx="12" fill="#14171C" stroke="#252A32"/>
          <text x="39" y="24" fill="#E6E8EB">10</text>
          <text x="39" y="40" fill="#6F7682" font-size="9">PDC</text>
        </g>
      </g>

      <text x="22" y="300" fill="#6F7682" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CAN · UDS · ODX · MQB · OEM RETROFIT</text>
    </g>
  </g>
</svg>