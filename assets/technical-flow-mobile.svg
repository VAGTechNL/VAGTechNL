<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL mobile technical flow</title>
<desc id="desc">Vertical technical flow from vehicle input to evidence, knowledge and tooling, with a slow sequential pulse.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080B"/><stop offset="1" stop-color="#0D0F13"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A7ADB7" stroke-opacity=".04"/></pattern>
</defs>
<style>@media (prefers-reduced-motion: reduce){.flow-motion{display:none}}</style>
<rect width="640" height="890" rx="28" fill="url(#bg)"/>
<rect width="640" height="890" rx="28" fill="url(#grid)"/>
<rect x="1" y="1" width="638" height="888" rx="27" fill="none" stroke="#1C2026" stroke-width="2"/>
<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <text x="36" y="48" fill="#6F7682" font-size="14" font-weight="700" letter-spacing="2.2">TECHNICAL FLOW</text>
  <text x="36" y="84" fill="#FFFFFF" font-size="28" font-weight="800">Signal → evidence → knowledge.</text>
  <text x="36" y="112" fill="#A7ADB7" font-size="16">Preserve context. Verify evidence. Keep changes reversible.</text>
  <g transform="translate(82 146)">
    <g stroke="#252A32" stroke-width="4" stroke-linecap="round"><path d="M238 108V136M238 244V272M238 380V408M238 516V544"/></g>
    <g fill="#E10600"><circle cx="238" cy="122" r="5" opacity=".62"/><circle cx="238" cy="258" r="5" opacity=".54"/><circle cx="238" cy="394" r="5" opacity=".46"/><circle cx="238" cy="530" r="5" opacity=".38"/></g>

    <rect x="0" y="0" width="476" height="108" rx="18" fill="#14171C" stroke="#1C2026"/>
    <text x="22" y="30" fill="#6F7682" font-size="12" font-weight="700" letter-spacing="1.4">INPUT</text>
    <text x="22" y="62" fill="#FFFFFF" font-size="22" font-weight="800">VEHICLE</text>
    <text x="22" y="88" fill="#A7ADB7" font-size="15">scan · module · dataset</text>

    <rect x="0" y="136" width="476" height="108" rx="18" fill="#14171C" stroke="#1C2026"/>
    <text x="22" y="166" fill="#6F7682" font-size="12" font-weight="700" letter-spacing="1.4">ROUTE</text>
    <text x="22" y="198" fill="#FFFFFF" font-size="22" font-weight="800">GATEWAY / CAN</text>
    <text x="22" y="224" fill="#FF2A23" font-size="15">network route · control-module path</text>

    <rect x="0" y="272" width="476" height="108" rx="18" fill="#14171C" stroke="#1C2026"/>
    <text x="22" y="302" fill="#6F7682" font-size="12" font-weight="700" letter-spacing="1.4">METHOD</text>
    <text x="22" y="334" fill="#FFFFFF" font-size="22" font-weight="800">UDS / ODX</text>
    <text x="22" y="360" fill="#A7ADB7" font-size="15">diagnostics · coding · structured context</text>

    <rect x="0" y="408" width="476" height="108" rx="18" fill="#14171C" stroke="#1C2026"/>
    <text x="22" y="438" fill="#6F7682" font-size="12" font-weight="700" letter-spacing="1.4">PROOF</text>
    <text x="22" y="470" fill="#FFFFFF" font-size="22" font-weight="800">EVIDENCE</text>
    <text x="22" y="496" fill="#A7ADB7" font-size="15">source · revision · vehicle context</text>

    <rect x="0" y="544" width="476" height="108" rx="18" fill="#14171C" stroke="#1C2026"/>
    <text x="22" y="574" fill="#6F7682" font-size="12" font-weight="700" letter-spacing="1.4">OUTPUT</text>
    <text x="22" y="606" fill="#FFFFFF" font-size="22" font-weight="800">KNOWLEDGE + TOOLING</text>
    <text x="22" y="632" fill="#A7ADB7" font-size="15">traceable · reusable · testable</text>

    <g class="flow-motion" fill="none" stroke="#FF2A23" stroke-width="2" pointer-events="none">
      <rect x="0" y="0" width="476" height="108" rx="18" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;.34;.08;.30;.08;.26;.06;0" keyTimes="0;.02;.055;.09;.125;.16;.19;1"/></rect>
      <rect x="0" y="136" width="476" height="108" rx="18" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.34;.08;.30;.08;.26;.06;0" keyTimes="0;.2;.22;.255;.29;.325;.36;.39;1"/></rect>
      <rect x="0" y="272" width="476" height="108" rx="18" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.34;.08;.30;.08;.26;.06;0" keyTimes="0;.4;.42;.455;.49;.525;.56;.59;1"/></rect>
      <rect x="0" y="408" width="476" height="108" rx="18" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.34;.08;.30;.08;.26;.06;0" keyTimes="0;.6;.62;.655;.69;.725;.76;.79;1"/></rect>
      <rect x="0" y="544" width="476" height="108" rx="18" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.34;.08;.30;.08;.26;.06;0" keyTimes="0;.8;.82;.855;.89;.925;.96;.99;1"/></rect>
    </g>

    <g class="flow-motion" fill="#FF2A23" pointer-events="none">
      <circle r="5" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.82;.82;0;0" keyTimes="0;.15;.16;.19;.2;1"/><animateMotion dur="30s" repeatCount="indefinite" path="M238 108 L238 136" keyPoints="0;0;1;1" keyTimes="0;.15;.195;1" calcMode="linear"/></circle>
      <circle r="5" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.82;.82;0;0" keyTimes="0;.35;.36;.39;.4;1"/><animateMotion dur="30s" repeatCount="indefinite" path="M238 244 L238 272" keyPoints="0;0;1;1" keyTimes="0;.35;.395;1" calcMode="linear"/></circle>
      <circle r="5" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.82;.82;0;0" keyTimes="0;.55;.56;.59;.6;1"/><animateMotion dur="30s" repeatCount="indefinite" path="M238 380 L238 408" keyPoints="0;0;1;1" keyTimes="0;.55;.595;1" calcMode="linear"/></circle>
      <circle r="5" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.82;.82;0;0" keyTimes="0;.75;.76;.79;.8;1"/><animateMotion dur="30s" repeatCount="indefinite" path="M238 516 L238 544" keyPoints="0;0;1;1" keyTimes="0;.75;.795;1" calcMode="linear"/></circle>
    </g>

    <g class="flow-motion" fill="none" stroke="#FF2A23" stroke-width="1.5" pointer-events="none">
      <circle cx="238" cy="122" r="5" opacity="0">
        <animate attributeName="r" dur="30s" repeatCount="indefinite" values="5;5;11;13;13" keyTimes="0;.168;.178;.198;1"/>
        <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.26;0;0" keyTimes="0;.168;.178;.198;1"/>
      </circle>
      <circle cx="238" cy="258" r="5" opacity="0">
        <animate attributeName="r" dur="30s" repeatCount="indefinite" values="5;5;11;13;13" keyTimes="0;.368;.378;.398;1"/>
        <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.26;0;0" keyTimes="0;.368;.378;.398;1"/>
      </circle>
      <circle cx="238" cy="394" r="5" opacity="0">
        <animate attributeName="r" dur="30s" repeatCount="indefinite" values="5;5;11;13;13" keyTimes="0;.568;.578;.598;1"/>
        <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.26;0;0" keyTimes="0;.568;.578;.598;1"/>
      </circle>
      <circle cx="238" cy="530" r="5" opacity="0">
        <animate attributeName="r" dur="30s" repeatCount="indefinite" values="5;5;11;13;13" keyTimes="0;.768;.778;.798;1"/>
        <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;.26;0;0" keyTimes="0;.768;.778;.798;1"/>
      </circle>
    </g>
  </g>

  <g transform="translate(36 826)">
    <path d="M0 0H568" stroke="#1C2026"/>
    <text x="0" y="30" fill="#E10600" font-size="12" font-weight="800" letter-spacing="1.5">RULE</text>
    <text x="56" y="30" fill="#E6E8EB" font-size="14">Unknown stays unknown · no compatibility claim without evidence.</text>
  </g>
</g>
</svg>