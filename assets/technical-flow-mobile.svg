<svg xmlns="http://www.w3.org/2000/svg" width="640" height="770" viewBox="0 0 640 770" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL mobile evidence flow</title><desc id="desc">Vertical evidence-first method from case and context to knowledge and controlled output.</desc><defs><style>@media (prefers-reduced-motion: reduce){.flow-motion{display:none}}</style></defs>
<rect width="640" height="770" rx="22" fill="#06080B"/><rect x="1" y="1" width="638" height="768" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><g transform="translate(34 36)"><path d="M0 0H22" stroke="#E30613" stroke-width="2"/><text x="34" y="4" fill="#A7ADB7" font-size="11" font-weight="750" letter-spacing="1.6">TECHNICAL METHOD</text><text x="0" y="46" fill="#FFFFFF" font-size="27" font-weight="820">Context first. Evidence before conclusion.</text><text x="0" y="73" fill="#6F7682" font-size="14">Uncertainty remains visible until it is actually resolved.</text></g>
<g transform="translate(52 138)"><path d="M268 92V112M268 204V224M268 316V336M268 428V448" stroke="#252A32" stroke-width="2"/><g fill="#E30613"><circle cx="268" cy="102" r="3.5"/><circle cx="268" cy="214" r="3.5" opacity=".78"/><circle cx="268" cy="326" r="3.5" opacity=".58"/><circle cx="268" cy="438" r="3.5" opacity=".42"/></g><circle class="flow-motion" cx="268" cy="102" r="4" fill="#FF6B73"><animate attributeName="cy" values="102;438;102" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.9;.2" dur="9s" repeatCount="indefinite"/></circle>
<g><rect width="536" height="92" rx="11" fill="#0B0E12" stroke="#1C2026"/><text x="18" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">01 / CASE</text><text x="18" y="54" fill="#FFFFFF" font-size="18" font-weight="820">OBSERVE</text><text x="174" y="54" fill="#A7ADB7" font-size="13">question · observation · source</text></g>
<g transform="translate(0 112)"><rect width="536" height="92" rx="11" fill="#0B0E12" stroke="#1C2026"/><text x="18" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">02 / CONTEXT</text><text x="18" y="54" fill="#FFFFFF" font-size="18" font-weight="820">IDENTIFY</text><text x="174" y="54" fill="#A7ADB7" font-size="13">vehicle · module · revision</text></g>
<g transform="translate(0 224)"><rect width="536" height="92" rx="11" fill="#0B0E12" stroke="#E30613" stroke-opacity=".42"/><text x="18" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">03 / EVIDENCE</text><text x="18" y="54" fill="#FFFFFF" font-size="18" font-weight="820">VERIFY</text><text x="174" y="54" fill="#A7ADB7" font-size="13">confirmed · likely · unknown</text></g>
<g transform="translate(0 336)"><rect width="536" height="92" rx="11" fill="#0B0E12" stroke="#1C2026"/><text x="18" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">04 / KNOWLEDGE</text><text x="18" y="54" fill="#FFFFFF" font-size="18" font-weight="820">PRESERVE</text><text x="174" y="54" fill="#A7ADB7" font-size="13">source · decision · context</text></g>
<g transform="translate(0 448)"><rect width="536" height="92" rx="11" fill="#0B0E12" stroke="#1C2026"/><text x="18" y="27" fill="#6F7682" font-size="10" font-weight="750" letter-spacing="1.3">05 / OUTPUT</text><text x="18" y="54" fill="#FFFFFF" font-size="18" font-weight="820">REUSE</text><text x="174" y="54" fill="#A7ADB7" font-size="13">forum · knowledge · tooling</text></g></g>
<g transform="translate(34 704)"><path d="M0 0H572" stroke="#1C2026"/><text x="0" y="28" fill="#E30613" font-size="11" font-weight="800">RULE</text><text x="52" y="28" fill="#E6E8EB" font-size="13">Unknown stays unknown · no compatibility claim without evidence.</text></g></g></svg>