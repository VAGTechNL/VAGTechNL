<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc">
<title id="title">VAGTechNL mobile evidence-first technical method</title><desc id="desc">Vertical technical method with verification as the evidence gate.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080B"/><stop offset="1" stop-color="#11151B"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151A21"/><stop offset="1" stop-color="#0D0F13"/></linearGradient><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style></defs>
<rect width="640" height="850" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="638" height="848" rx="21" fill="none" stroke="#1C2026" stroke-width="2"/>
<g class="sans"><g transform="translate(34 36)"><path d="M0 0H24" stroke="#E30613" stroke-width="2.5"/><text x="36" y="4" class="mono" fill="#A7ADB7" font-size="10.5" font-weight="720" letter-spacing="1.55">TECHNICAL METHOD</text><text x="0" y="48" fill="#FFFFFF" font-size="27" font-weight="840">The decision point is evidence.</text><text x="0" y="76" fill="#6F7682" font-size="14">Observe. Identify. Verify. Preserve. Reuse.</text></g>
<g transform="translate(52 136)">
  <path d="M268 100V120M268 220V240M268 364V384M268 484V504" stroke="#252A32" stroke-width="3"/><g fill="#E30613"><circle cx="268" cy="110" r="4"/><circle cx="268" cy="230" r="4" opacity=".78"/><circle cx="268" cy="374" r="4" opacity=".58"/><circle cx="268" cy="494" r="4" opacity=".42"/></g>
  <g><rect width="536" height="100" rx="11" fill="url(#panel)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#6F7682" font-size="9.5">01 / CASE</text><text x="18" y="54" fill="#FFFFFF" font-size="19" font-weight="840">OBSERVE</text><text x="176" y="54" fill="#A7ADB7" font-size="13">Question · source</text><text x="18" y="79" fill="#6F7682" font-size="11">Capture what is actually known.</text></g>
  <g transform="translate(0 120)"><rect width="536" height="100" rx="11" fill="url(#panel)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#6F7682" font-size="9.5">02 / CONTEXT</text><text x="18" y="54" fill="#FFFFFF" font-size="19" font-weight="840">IDENTIFY</text><text x="176" y="54" fill="#A7ADB7" font-size="13">Vehicle · module · revision</text><text x="18" y="79" fill="#6F7682" font-size="11">Context before comparison.</text></g>
  <g transform="translate(0 240)"><rect width="536" height="124" rx="13" fill="#11151B" stroke="#E30613" stroke-opacity=".7" stroke-width="1.5"/><rect width="4" height="124" rx="2" fill="#E30613"/><text x="18" y="27" class="mono" fill="#FF6B73" font-size="9.5">03 / EVIDENCE GATE</text><text x="18" y="60" fill="#FFFFFF" font-size="22" font-weight="860">VERIFY</text><text x="176" y="60" fill="#A7ADB7" font-size="12.5">BEVESTIGD · AANNEMELIJK · ONBEKEND</text><path d="M18 78H518" stroke="#252A32"/><text x="18" y="101" fill="#6F7682" font-size="11">No visual confidence becomes technical fact.</text><circle class="motion" cx="506" cy="27" r="4" fill="#FF6B73"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(0 384)"><rect width="536" height="100" rx="11" fill="url(#panel)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#6F7682" font-size="9.5">04 / KNOWLEDGE</text><text x="18" y="54" fill="#FFFFFF" font-size="19" font-weight="840">PRESERVE</text><text x="176" y="54" fill="#A7ADB7" font-size="13">Source · decision · context</text><text x="18" y="79" fill="#6F7682" font-size="11">Keep the reasoning traceable.</text></g>
  <g transform="translate(0 504)"><rect width="536" height="100" rx="11" fill="url(#panel)" stroke="#1C2026"/><text x="18" y="25" class="mono" fill="#6F7682" font-size="9.5">05 / OUTPUT</text><text x="18" y="54" fill="#FFFFFF" font-size="19" font-weight="840">REUSE</text><text x="176" y="54" fill="#A7ADB7" font-size="13">Forum · knowledge · tooling</text><text x="18" y="79" fill="#6F7682" font-size="11">Only inside the proven scope.</text></g>
</g>
<g transform="translate(34 784)"><path d="M0 0H572" stroke="#1C2026"/><text x="0" y="28" class="mono" fill="#E30613" font-size="9.5" font-weight="800">RULE</text><text x="52" y="28" fill="#E6E8EB" font-size="12.5">Unknown stays unknown · no compatibility claim without evidence.</text></g></g>
</svg>